# ทดสอบ → สร้างหน้าเว็บ → เผยแพร่ขึ้น GitHub Pages ทุกครั้งที่ push เข้า main
# ตั้งค่าครั้งแรก: Settings → Pages → Source: GitHub Actions
name: Deploy web to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ทดสอบตรรกะหลัก
        run: node tools/test-core.js && node tools/test-gas.js
      - name: สร้างหน้าเว็บ
        run: node tools/build-demo.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
