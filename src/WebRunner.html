    return new Promise(function (resolve) {
      var f = el('iframe', { title: 'ตรวจงาน', tabindex: '-1' });
      f.style.cssText = 'border:0;display:block;width:' + (o.width || 360) + 'px;height:700px';
      var done = false, errs = [], logs = [], timer;
      function finish(r) {
        if (done) return; done = true; clearTimeout(timer); unmount(f); f.remove();
        r.errors = errs; r.logs = logs; resolve(r);
      }
      timer = setTimeout(function () { finish({ output: '', timeout: true, error: { name: 'Timeout', message: 'หน้าเว็บโหลดหรือตรวจนานเกินไป' } }); }, o.timeoutMs || 15000);
      host().appendChild(f);
      var loads = 0;
      f.addEventListener('load', function () {
        // หน้าเว็บโหลดซ้ำ = ฟอร์มถูกส่งจริงหรือเปลี่ยนหน้า (โค้ดตรวจจะหายไปด้วย)
        if (++loads > 1) finish({ output: '', error: { name: 'Reloaded', message: 'หน้าเว็บถูกโหลดใหม่ระหว่างตรวจ อาจเพราะส่งฟอร์มโดยไม่ได้ใช้ e.preventDefault() หรือ @submit.prevent' } });
      });
      mount(f, code, { lang: o.lang, test: true, db: o.db, onMsg: function (m) {
        if (m.t === 'error') errs.push(m);
        else if (m.t === 'log') logs.push(m.text);
        else if (m.t === 'ready') setTimeout(function () {
          if (check === null) { finish({ output: logs.join('\n'), error: errs[0] || null }); return; }
          try { f.contentWindow.postMessage({ __simCheck: f.__rid, id: 1, code: check || 'return document.body.innerText' }, '*'); } catch (e) { finish({ output: '', error: { name: 'Crash', message: String(e) } }); }
        }, o.settleMs || 150);
        else if (m.t === 'checkResult') finish(m.error !== undefined ? { output: '', error: { name: 'CheckError', message: m.error } } : { output: m.value, error: null });
      } });
    });
  }
  /** tests: [{ check | input }] → ผลของแต่ละชุดตามลำดับ (ใช้หน้าเว็บใหม่ทุกชุด สถานะจึงไม่ปนกัน) */
  function tests(code, list, o) {
    var out = [];
    return list.reduce(function (p, t) {
      return p.then(function () { return runOne(code, t.check || t.input || '', o).then(function (r) { out.push(r); }); });
    }, Promise.resolve()).then(function () { return out; });
  }
  return {
    mount: mount, unmount: unmount, tests: tests, freshDb: freshDb, build: build, guardJs: guardJs,
    /** รันแล้วเก็บ console.log (ใช้กับข้อ "ทายผลลัพธ์" ของ JavaScript) */
    logs: function (code, lang) { return runOne(code, null, { lang: lang || 'js', settleMs: 300 }); }
  };
})();

/* ======================= แปล error ของเว็บเป็นภาษาไทย ======================= */
function thaiJsError(m) {
  var s = String((m && m.message) || ''), x;
  if ((m && m.name === 'LoopTimeout') || /LoopTimeout/.test(s)) return 'ลูปทำงานนานเกินไปจึงถูกหยุด ตรวจเงื่อนไขของ while / for ว่ามีจุดสิ้นสุด (เช่น ลืม i++)';
  if (m && m.kind === 'resource') return 'โหลดไฟล์จากลิงก์นี้ไม่ได้ ตรวจการสะกดลิงก์ใน src / href และการเชื่อมต่ออินเทอร์เน็ต';
  if (m && m.name === 'Timeout') return 'หน้าเว็บโหลดหรือทำงานนานเกินไป';
  if (/\[Vue warn\]/.test(s)) {
    if ((x = s.match(/Property "([^"]+)" was accessed during render but is not defined/))) return 'Vue ไม่รู้จัก ' + x[1] + ' — ต้องประกาศใน data() หรือ setup() แล้ว return ออกมา และสะกดให้ตรงกับในเทมเพลต';
    if ((x = s.match(/Failed to resolve component: ([\w-]+)/))) return 'Vue ไม่รู้จักคอมโพเนนต์ ' + x[1] + ' — ลืม app.component(...) ก่อน mount หรือสะกดชื่อผิด';
    if (/mount target selector/.test(s)) return 'หา element ที่จะ mount ไม่เจอ ตรวจว่า mount("#app") ตรงกับ <div id="app">';
    if (/Unhandled error during execution/.test(s)) return 'เกิดข้อผิดพลาดในฟังก์ชันของ Vue ดูข้อความ error ด้านบน';
    return 'คำเตือนจาก Vue ตรวจชื่อตัวแปรและคำสั่งในเทมเพลต';
  }
  if ((x = s.match(/(\S+) is not defined/))) return 'ไม่รู้จักชื่อ ' + x[1] + ' — สะกดผิด (ตัวพิมพ์เล็ก/ใหญ่ต่างกัน) ยังไม่ได้ประกาศด้วย let / const หรือลืมโหลดไลบรารี' + (x[1] === 'Vue' ? ' ให้ใส่ <script src="https://cdnjs.cloudflare.com/ajax/libs/vue/3.4.38/vue.global.js"><\/script> ก่อนสคริปต์ของเรา' : '');
  if ((x = s.match(/Cannot (?:read|set) propert(?:y|ies) of (null|undefined)(?: \((?:reading|setting) '([^']+)'\))?/))) return 'ใช้ .' + (x[2] || '…') + ' กับค่าที่เป็น ' + x[1] + (x[1] === 'null' ? ' — มักเกิดจาก querySelector / getElementById หา element ไม่เจอ ตรวจ id / class ให้ตรงกัน หรือวาง <script> ไว้ท้าย <body>' : ' — ตัวแปรยังไม่มีค่า หรือสะกดชื่อ property ผิด');
  if ((x = s.match(/([\w.$\[\]"']+) is not a function/))) return x[1] + ' ไม่ใช่ฟังก์ชัน — ตรวจการสะกดชื่อเมธอด (เช่น getElementById, addEventListener) หรือข้อมูลไม่ใช่ชนิดที่คิด (เช่น ใช้ .map กับค่าที่ไม่ใช่ array)';
  if (/Assignment to constant variable/.test(s)) return 'ตัวแปร const เปลี่ยนค่าไม่ได้ ถ้าต้องเปลี่ยนค่าให้ประกาศด้วย let';
  if ((x = s.match(/Identifier '([^']+)' has already been declared/))) return 'ประกาศชื่อ ' + x[1] + ' ซ้ำ ชื่อเดียวกันใช้ let / const ได้ครั้งเดียว';
  if (/Unexpected end of input/.test(s)) return 'ปิดวงเล็บ { } หรือ ( ) ไม่ครบคู่';
  if (/await is only valid/.test(s)) return 'ใช้ await ได้เฉพาะในฟังก์ชันที่มีคำว่า async นำหน้า';
  if (/is not valid JSON|in JSON at position|JSON\.parse|Unexpected token '<'/.test(s)) return 'ข้อมูลที่ได้ไม่ใช่ JSON ตรวจลิงก์ API และใช้ JSON.stringify ตอนส่งข้อมูล';
  if (/Unexpected token|Invalid or unexpected token|missing \) after|Unexpected identifier|Unexpected string|Unexpected number/.test(s)) return 'เขียนผิดรูปแบบ ตรวจเครื่องหมาย , ; ( ) { } และเครื่องหมายคำพูดในบรรทัดนี้หรือบรรทัดก่อนหน้า';
  if (/Failed to fetch|NetworkError|Load failed/.test(s)) return 'เรียกข้อมูลไม่สำเร็จ ตรวจลิงก์ (ในตัวจำลองใช้ /api/ชื่อตาราง)';
  if (m && m.name === 'CheckError') return 'ตรวจหน้าเว็บไม่ได้: ' + s;
  if (m && m.name === 'Reloaded') return s;
  if (/TypeError/.test(s)) return 'ใช้ข้อมูลผิดชนิดกับคำสั่งนี้';
  return '';
}

/* ======================= วิดเจ็ตตัวจำลองเว็บ + หน้าจอมือถือ ======================= */
/**
 * WebSim(host, { code, starter, lang: 'html'|'js', live, onChange, extraTools:[{label, cls, onClick}], title, device })
 * คืนค่า { editor, getCode, run, root }
 */
function WebSim(host, o) {
  o = o || {};
  var lang = o.lang === 'js' ? 'js' : 'html';
  var state = { storage: {}, db: null, device: o.device || 'phone', live: o.live !== false && lang === 'html', ran: false };
  var root = el('div', { class: 'wsim', 'data-view': 'code' });
  var seg = el('div', { class: 'wsim-seg', role: 'tablist' });
  var sCode = el('button', { type: 'button', class: 'on' }, '✏️ โค้ด'), sView = el('button', { type: 'button' }, lang === 'js' ? '🧾 ผลลัพธ์' : '📱 หน้าจอ');
  seg.appendChild(sCode); seg.appendChild(sView);
  var grid = el('div', { class: 'wsim-grid' });
  var left = el('div', { class: 'wsim-code' });
  var head = el('div', { class: 'wsim-head' });
  head.innerHTML = '<span class="dots"><i></i><i></i><i></i></span><span class="fname">' + (lang === 'js' ? 'script.js' : 'index.html') + '</span>';
  var keys = el('div', { class: 'keys', 'aria-label': 'แป้นสัญลักษณ์' });
  var KEYS = lang === 'js' ? ['⇥', '(', ')', '{', '}', '[', ']', ';', '.', '=', '"', "'", '`', '$', '+', '<', '>', '!', '&', '|', ':', ','] : ['⇥', '<', '>', '/', '=', '"', "'", '{', '}', '(', ')', ';', ':', '.', '#', '-', '@', '`', '$', '!', '&', '[', ']'];
  KEYS.forEach(function (k) { var b = el('button', { type: 'button', title: k === '⇥' ? 'ย่อหน้า' : k }, k); b.onclick = function () { editor.insert(k === '⇥' ? '  ' : k); }; keys.appendChild(b); });
  var edHost = el('div', { class: 'ed' });
  left.appendChild(head); left.appendChild(keys); left.appendChild(edHost);
  var right = el('div', { class: 'wsim-view' });
  var dev = el('div', { class: 'wsim-dev' });
  var bPhone = el('button', { type: 'button', title: 'จอมือถือ 360px' }, '📱'), bDesk = el('button', { type: 'button', title: 'จอคอม 1024px' }, '💻');
  var urlBar = el('span', { class: 'url' }, lang === 'js' ? 'Console' : 'sim.local');
  if (lang === 'html') { dev.appendChild(bPhone); dev.appendChild(bDesk); }
  dev.appendChild(urlBar);
  var phone = el('div', { class: 'phone' + (lang === 'js' ? ' hidden' : '') });
  var screen = el('div', { class: 'screen' });
  var sbar = el('div', { class: 'sbar' }); sbar.innerHTML = '<b>9:41</b><span class="notch"></span><span>📶 🔋</span>';
  var frame = el('iframe', { title: 'ผลลัพธ์ของโค้ด' });
  screen.appendChild(frame); phone.appendChild(sbar); phone.appendChild(screen);
  frame.addEventListener('load', function () {
    if (++state.loads > 1) line('warn', '<span class="pf">⚠</span>หน้าเว็บถูกโหลดใหม่ (หน้าจอว่าง) <span class="th">💬 มักเกิดจากส่งฟอร์มโดยไม่ได้ใช้ e.preventDefault() หรือ @submit.prevent หรือกดลิงก์ที่ไม่ได้ขึ้นต้นด้วย # กด ▶ รัน เพื่อเริ่มใหม่</span>');
  });
  var con = el('div', { class: 'wcon', 'aria-live': 'polite' });
  right.appendChild(dev); right.appendChild(phone); right.appendChild(con);
  grid.appendChild(left); grid.appendChild(right);
  var tools = el('div', { class: 'tools' });
  var runBtn = el('button', { class: 'btn primary', type: 'button' }, '▶ รัน');
  var liveLab = el('label', { class: 'live', title: 'แก้โค้ดแล้วหน้าจอเปลี่ยนตามทันที' });
  var liveCb = el('input', { type: 'checkbox' }); liveCb.checked = state.live;
  liveLab.appendChild(liveCb); liveLab.appendChild(document.createTextNode(' ⚡ สด'));
  tools.appendChild(runBtn); if (lang === 'html') tools.appendChild(liveLab);
  (o.extraTools || []).forEach(function (t) { var b = el('button', { class: 'btn ' + (t.cls || ''), type: 'button' }, t.label); b.onclick = function () { t.onClick(b); }; tools.appendChild(b); });
  var dlBtn = el('button', { class: 'btn', type: 'button', title: 'ดาวน์โหลดเป็นไฟล์ไปเปิดในเครื่อง' }, '⬇');
  var dbBtn = el('button', { class: 'btn', type: 'button', title: 'ล้างข้อมูลที่บันทึก (localStorage) และคืนฐานข้อมูลตัวอย่าง' }, '🗄');
  var resetBtn = el('button', { class: 'btn', type: 'button', title: 'คืนค่าโค้ดตั้งต้น' }, '↺');
  tools.appendChild(dlBtn); tools.appendChild(dbBtn); tools.appendChild(resetBtn);
  root.appendChild(seg); root.appendChild(grid); root.appendChild(tools);
  host.appendChild(root);

  var editor = makeEditor(edHost, o.code || '', { mode: lang === 'js' ? 'javascript' : 'htmlmixed', onChange: function (v) { if (o.onChange) o.onChange(v); if (liveCb.checked && lang === 'html') liveRun(); } });
  editor.refresh();
  var starter = o.starter !== undefined ? o.starter : (o.code || '');
  var liveTimer = null;
  function liveRun() { clearTimeout(liveTimer); liveTimer = setTimeout(function () { run(true); }, 700); }

  function line(cls, html) {
    if (con.querySelector('.ph')) con.innerHTML = '';
    var d = el('div', { class: 'ln ' + cls }); d.innerHTML = html; con.appendChild(d);
    if (con.children.length > 200) con.removeChild(con.firstChild);
    con.scrollTop = con.scrollHeight;
  }
  function onMsg(m) {
    if (m.t === 'log') line(m.level, '<span class="pf">' + (m.level === 'warn' ? '⚠' : m.level === 'error' ? '✗' : '›') + '</span>' + esc(m.text) + (m.level !== 'log' && thaiJsError({ message: m.text }) ? '<span class="th">💬 ' + esc(thaiJsError({ message: m.text })) + '</span>' : ''));
    else if (m.t === 'error') {
      var th = thaiJsError(m);
      line('error', '<span class="pf">✗</span>' + (m.line ? '<b>บรรทัด ' + m.line + ':</b> ' : '') + esc(m.message) + (th ? '<span class="th">💬 ' + esc(th) + '</span>' : ''));
      if (m.line) editor.mark(m.line, 'cm-err-line');
    }
    else if (m.t === 'net') line('net', '<span class="pf">⇄</span>' + esc(m.method + ' ' + m.url) + ' <span class="st s' + String(m.status).charAt(0) + '">' + m.status + '</span>');
    else if (m.t === 'storage') state.storage = m.data;
    else if (m.t === 'db') state.db = m.data;
    else if (m.t === 'ready') { if (m.title) urlBar.textContent = m.title; if (lang === 'js' && !con.querySelector('.ln')) con.innerHTML = '<div class="ph">(โปรแกรมทำงานเสร็จ แต่ไม่มี console.log)</div>'; }
  }
  function run(quiet) {
    editor.clearMarks(); state.ran = true;
    con.innerHTML = '<div class="ph">' + (lang === 'js' ? 'กำลังรัน…' : 'Console: console.log และ error จะแสดงที่นี่') + '</div>';
    urlBar.textContent = lang === 'js' ? 'Console' : 'sim.local';
    state.loads = 0;
    WebRunner.mount(frame, editor.get(), { lang: lang, storage: state.storage, db: state.db || (state.db = WebRunner.freshDb()), onMsg: onMsg });
    if (!quiet) setView('view');
  }
  function setView(v) { root.setAttribute('data-view', v); sCode.classList.toggle('on', v === 'code'); sView.classList.toggle('on', v === 'view'); if (v === 'code') editor.refresh(); fit(); }
  sCode.onclick = function () { setView('code'); }; sView.onclick = function () { if (!state.ran) run(true); setView('view'); };
  runBtn.onclick = function () { run(false); };
  liveCb.onchange = function () { if (liveCb.checked) run(true); };
  dlBtn.onclick = function () { downloadText(lang === 'js' ? 'script.js' : 'index.html', editor.get(), lang === 'js' ? 'text/javascript' : 'text/html'); };
  dbBtn.onclick = function () { state.storage = {}; state.db = WebRunner.freshDb(); toast('ล้าง localStorage และคืนฐานข้อมูลตัวอย่างแล้ว', 'ok'); run(true); };
  resetBtn.onclick = function () { if (confirm('คืนค่าโค้ดตั้งต้น? โค้ดที่แก้ไว้จะหายไป')) { editor.set(starter); editor.clearMarks(); run(true); } };
  function setDevice(d) { state.device = d; bPhone.classList.toggle('on', d === 'phone'); bDesk.classList.toggle('on', d === 'desk'); phone.classList.toggle('desk', d === 'desk'); fit(); }
  bPhone.onclick = function () { setDevice('phone'); }; bDesk.onclick = function () { setDevice('desk'); };
  function fit() {
    if (lang === 'js') return;
    var avail = (right.clientWidth || 320) - 24 - (state.device === 'phone' ? 24 : 18);
    var W = state.device === 'phone' ? 360 : 1024, Hh = state.device === 'phone' ? 680 : 640;
    var s = Math.max(0.3, Math.min(1, avail / W));
    frame.style.width = W + 'px'; frame.style.height = Hh + 'px'; frame.style.transform = 'scale(' + s + ')';
    screen.style.width = Math.floor(W * s) + 'px'; screen.style.height = Math.floor(Hh * s) + 'px';
  }
  if (window.ResizeObserver) new ResizeObserver(function () { fit(); }).observe(right);
  setDevice(state.device);
  // รันอัตโนมัติเมื่อเลื่อนมาเห็น (ประหยัดเครื่องเมื่อหน้ามีตัวอย่างหลายอัน)
  if (lang === 'html') {
    if (window.IntersectionObserver) {
      var io = new IntersectionObserver(function (es) { if (es.some(function (e) { return e.isIntersecting; })) { io.disconnect(); if (!state.ran) run(true); } }, { rootMargin: '200px' });
      io.observe(root);
    } else run(true);
  } else con.innerHTML = '<div class="ph">กด ▶ รัน เพื่อดูผลลัพธ์ใน Console</div>';
  return {
    editor: editor, root: root, runBtn: runBtn,
    getCode: function () { return editor.get(); },
    run: run, print: function (h) { con.innerHTML = h; }
  };
}
</script>
