<!-- Lib.html — ตัวช่วยทั่วไป: เรียก API, สร้าง element, toast, modal, Markdown, วันที่ไทย -->
<script>
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function el(tag, attrs, text) {
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function (k) { if (attrs[k] !== undefined && attrs[k] !== null && attrs[k] !== false) e.setAttribute(k, attrs[k]); });
  if (text !== undefined) e.textContent = text;
  return e;
}
function $(sel, root) { return (root || document).querySelector(sel); }
function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }
function store(k, v) {
  try { if (v === undefined) { var x = localStorage.getItem(k); return x === null ? null : JSON.parse(x); } if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; }
}

/* ---------- API ---------- */
var Api = {
  token: null,
  /** ลิงก์ Apps Script /exec จาก config.js (GitHub Pages) */
  url: function () { return (window.CS_CONFIG && /^https:\/\/script\.google(usercontent)?\.com\//.test(CS_CONFIG.apiUrl || '')) ? CS_CONFIG.apiUrl : ''; },
  /** sheet = Apps Script โดยตรง · github = GitHub Pages ต่อ Google Sheet · demo = ข้อมูลในเบราว์เซอร์ */
  mode: function () { return (window.google && google.script && google.script.run) ? 'sheet' : Api.url() ? 'github' : 'demo'; },
  call: function (method, payload) {
    var p = Object.assign({ token: Api.token }, payload || {});
    return new Promise(function (resolve, reject) {
      function fail(e) {
        var msg = String((e && e.message) || e || 'เกิดข้อผิดพลาด').replace(/^(Error|Exception|ข้อผิดพลาด):\s*/i, '');
        if (/เข้าสู่ระบบ/.test(msg) && Api.onAuthLost) Api.onAuthLost(msg);
        reject(new Error(msg));
      }
      if (window.google && google.script && google.script.run) {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(fail).api(method, p);
      } else if (Api.url()) {
        // หน้าเว็บบน GitHub Pages → เรียก Apps Script Web App (Google Sheet) โดยตรง
        // ใช้ text/plain เพื่อไม่ให้เบราว์เซอร์ส่ง CORS preflight (Apps Script ไม่รองรับ OPTIONS)
        fetch(Api.url(), { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ method: method, payload: p }) })
          .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
          .then(function (j) { if (j.ok) resolve(j.data); else fail(new Error(j.error)); })
          .catch(function (e) { fail(/HTTP|Failed to fetch|NetworkError|JSON/.test(String(e && e.message)) ? new Error('เชื่อมต่อฐานข้อมูล Google Sheet ไม่ได้ (' + e.message + ') ตรวจลิงก์ apiUrl ใน config.js และการ Deploy แบบ Anyone') : e); });
      } else if (window.DemoBackend) {
        setTimeout(function () { try { resolve(JSON.parse(JSON.stringify(DemoBackend.api(method, p)))); } catch (e) { fail(e); } }, 120);
      } else fail(new Error('ไม่พบเซิร์ฟเวอร์ (เปิดผ่านลิงก์ Web app)'));
    });
  }
};

/** ปุ่มแสดงสถานะกำลังทำงาน: withBusy(btn, promiseFn) */
function withBusy(btn, fn) {
  if (btn.disabled) return Promise.resolve();
  var old = btn.innerHTML; btn.disabled = true; btn.innerHTML = '<span class="spin"></span> ' + (btn.dataset.busy || 'กำลังทำงาน…');
  return Promise.resolve().then(fn).catch(function (e) { toast(e.message || String(e), 'bad'); throw e; })
    .finally(function () { btn.disabled = false; btn.innerHTML = old; });
}

function toast(msg, cls) {
  var box = $('#toast'); if (!box) { box = el('div', { id: 'toast' }); document.body.appendChild(box); }
  var d = el('div', { class: cls || '' }, msg); box.appendChild(d);
  setTimeout(function () { d.remove(); }, cls === 'bad' ? 5000 : 3000);
}

function modal(build, opts) {
  opts = opts || {};
  var bg = el('div', { class: 'modal-bg' }), m = el('div', { class: 'modal', role: 'dialog' });
  var x = el('button', { class: 'x', type: 'button', 'aria-label': 'ปิด' }, '✕');
  m.appendChild(x); bg.appendChild(m); document.body.appendChild(bg);
  function close() { bg.remove(); if (opts.onClose) opts.onClose(); }
  x.onclick = close; bg.addEventListener('click', function (e) { if (e.target === bg && !opts.sticky) close(); });
  build(m, close);
  return close;
}

function confirmBox(title, text, okLabel) {
  return new Promise(function (res) {
    modal(function (m, close) {
      m.appendChild(el('h2', {}, title));
      var p = el('p'); p.innerHTML = text; m.appendChild(p);
      var row = el('div', { class: 'row' });
      var no = el('button', { class: 'btn grow' }, 'ยกเลิก'), ok = el('button', { class: 'btn primary grow' }, okLabel || 'ยืนยัน');
      no.onclick = function () { res(false); close(); }; ok.onclick = function () { res(true); close(); };
      row.appendChild(no); row.appendChild(ok); m.appendChild(row);
    }, { onClose: function () { res(false); } });
  });
}

/* ---------- วันที่แบบไทย ---------- */
function thDate(iso, long) {
  if (!iso) return '-';
  var d = new Date(iso); if (isNaN(d)) return '-';
  return d.toLocaleDateString('th-TH', long ? { day: 'numeric', month: 'long', year: 'numeric' } : { day: 'numeric', month: 'short', year: '2-digit' });
}
function thDateTime(iso) { if (!iso) return '-'; var d = new Date(iso); return thDate(iso) + ' ' + d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' }); }
function fmt(n) { return n === null || n === undefined || n === '' ? '-' : (Math.round(Number(n) * 10) / 10).toLocaleString('th-TH'); }

var TYPE_ICON = { knowledge: '📖', worksheet: '📝', practice: '💻', quiz: '✅' };
var LEVEL_MEDAL = { 'ดีเยี่ยม': '🥇', 'ดีมาก': '🥈', 'ผ่าน': '🥉', gold: '🥇', silver: '🥈', bronze: '🥉' };
var LEVEL_KEY = { 'ดีเยี่ยม': 'gold', 'ดีมาก': 'silver', 'ผ่าน': 'bronze' };

/* ---------- Markdown แบบย่อ (escape ทุกอย่างก่อน จึงปลอดภัยจาก XSS) ---------- */
function mdInline(s) {
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, function (_, c) { return '<code>' + c + '</code>'; });
  s = s.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  s = s.replace(/(^|[\s(])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>');
  s = s.replace(/!\[([^\]]*)\]\((https?:\/\/[^)\s]+)\)/g, '<img alt="$1" src="$2">');
  s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
/**
 * mdRender(text, { onCode(lang, code, flags) → Element|null })
 * คืน DocumentFragment
 */
function mdRender(text, opts) {
  opts = opts || {};
  var root = el('div', { class: 'md' });
  var lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  var i = 0, html = [];
  function flush() { if (html.length) { var d = el('div'); d.innerHTML = html.join(''); while (d.firstChild) root.appendChild(d.firstChild); html = []; } }
  while (i < lines.length) {
    var ln = lines[i];
    var fence = ln.match(/^```\s*([\w-]*)\s*(.*)$/);
    if (fence) {
      var lang = fence[1] || 'text', flags = fence[2] || '', buf = [];
      i++;
      while (i < lines.length && !/^```\s*$/.test(lines[i])) { buf.push(lines[i]); i++; }
      i++;
      var code = buf.join('\n');
      flush();
      var node = opts.onCode ? opts.onCode(lang, code, flags) : null;
      if (!node) { node = el('pre', { class: 'code' }); node.textContent = code; }
      root.appendChild(node);
      continue;
    }
    if (/^\s*$/.test(ln)) { i++; continue; }
    var h = ln.match(/^(#{1,4})\s+(.*)$/);
    if (h) { var lv = Math.min(4, h[1].length + 1); html.push('<h' + lv + '>' + mdInline(h[2]) + '</h' + lv + '>'); i++; continue; }
    if (/^>\s?/.test(ln)) {
      var q = []; while (i < lines.length && /^>\s?/.test(lines[i])) { q.push(lines[i].replace(/^>\s?/, '')); i++; }
      html.push('<blockquote>' + q.map(mdInline).join('<br>') + '</blockquote>'); continue;
    }
    if (/^\|/.test(ln)) {
      var rows = []; while (i < lines.length && /^\|/.test(lines[i])) { rows.push(lines[i]); i++; }
      var cells = function (r) { return r.replace(/^\|/, '').replace(/\|\s*$/, '').split('|').map(function (c) { return c.trim(); }); };
      var t = '<table><thead><tr>' + cells(rows[0]).map(function (c) { return '<th>' + mdInline(c) + '</th>'; }).join('') + '</tr></thead><tbody>';
      rows.slice(1).filter(function (r) { return !/^\|[\s:|-]+$/.test(r); }).forEach(function (r) {
        t += '<tr>' + cells(r).map(function (c) { return '<td>' + mdInline(c) + '</td>'; }).join('') + '</tr>';
      });
      html.push(t + '</tbody></table>'); continue;
    }
    if (/^\s*[-*]\s+/.test(ln)) {
      var li = []; while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) { li.push('<li>' + mdInline(lines[i].replace(/^\s*[-*]\s+/, '')) + '</li>'); i++; }
      html.push('<ul>' + li.join('') + '</ul>'); continue;
    }
    if (/^\s*\d+[.)]\s+/.test(ln)) {
      var ol = []; while (i < lines.length && /^\s*\d+[.)]\s+/.test(lines[i])) { ol.push('<li>' + mdInline(lines[i].replace(/^\s*\d+[.)]\s+/, '')) + '</li>'); i++; }
      html.push('<ol>' + ol.join('') + '</ol>'); continue;
    }
    var para = [];
    while (i < lines.length && !/^\s*$/.test(lines[i]) && !/^(```|#{1,4}\s|>|\||\s*[-*]\s+|\s*\d+[.)]\s+)/.test(lines[i])) { para.push(lines[i]); i++; }
    html.push('<p>' + para.map(mdInline).join('<br>') + '</p>');
  }
  flush();
  return root;
}

function downloadText(filename, text, mime) {
  try {
    var blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    var a = el('a', { href: URL.createObjectURL(blob), download: filename });
    document.body.appendChild(a); a.click(); setTimeout(function () { a.remove(); }, 500);
  } catch (e) {
    modal(function (m) { m.appendChild(el('h2', {}, 'คัดลอกข้อมูล')); var t = el('textarea', { class: 'in mono', rows: 12 }); t.value = text; m.appendChild(t); });
  }
}
function toCsv(rows) {
  return '﻿' + rows.map(function (r) { return r.map(function (c) { c = c === null || c === undefined ? '' : String(c); return /[",\n]/.test(c) ? '"' + c.replace(/"/g, '""') + '"' : c; }).join(','); }).join('\r\n');
}

function confetti() {
  var colors = ['#1E40AF', '#F59E0B', '#059669', '#DC2626', '#8B5CF6', '#EC4899'];
  for (var i = 0; i < 80; i++) {
    var c = el('div', { class: 'confetti' });
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.8 + Math.random() * 1.8) + 's'; c.style.animationDelay = (Math.random() * .6) + 's';
    document.body.appendChild(c); (function (n) { setTimeout(function () { n.remove(); }, 4500); })(c);
  }
}

/* ---------- กราฟแดชบอร์ด (SVG/HTML ล้วน ไม่ใช้ไลบรารีภายนอก) ----------
   สีใช้ตัวแปร CSS จึงรองรับโหมดมืด · ทุกแท่ง/จุดมี tooltip เมื่อชี้หรือแตะ · มีปุ่มดูเป็นตาราง */
var Charts = (function () {
  var tip = null;
  function tipShow(x, y, html) {
    if (!tip) { tip = el('div', { class: 'ch-tip', role: 'tooltip' }); document.body.appendChild(tip); }

    var w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x - w / 2)) + 'px';
    tip.style.top = (y - h - 14 < 8 ? y + 18 : y - h - 14) + 'px';

  function tipHide() { if (tip) tip.style.display = 'none'; }
  window.addEventListener('scroll', tipHide, { passive: true });
  function bindTip(node, html) {
    node.addEventListener('mousemove', function (e) { tipShow(e.clientX, e.clientY, typeof html === 'function' ? html(e) : html); });
    node.addEventListener('mouseleave', tipHide);
    node.addEventListener('touchstart', function (e) { var t = e.touches[0]; tipShow(t.clientX, t.clientY, typeof html === 'function' ? html(t) : html); clearTimeout(node.__tt); node.__tt = setTimeout(tipHide, 2000); }, { passive: true });
  }
  function niceMax(v) { if (v <= 5) return 5; var p = Math.pow(10, Math.floor(Math.log10(v))), n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * p; }
  function tableToggle(host, head, rows) {
    var d = el('details', { class: 'ch-table' });
    d.appendChild(el('summary', {}, 'ดูเป็นตาราง'));
    var t = '<table class="tests"><tr>' + head.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join('') + '</tr>';
    rows.forEach(function (r) { t += '<tr>' + r.map(function (c) { return '<td>' + esc(c) + '</td>'; }).join('') + '</tr>'; });
    var w = el('div'); w.innerHTML = t + '</table>'; d.appendChild(w); host.appendChild(d);
  }
  /** แท่งแนวนอน (ร้อยละรายภารกิจ ฯลฯ) rows: [{ label, value, text, tip, muted, onClick }] */
  function hbars(host, rows, o) {
    o = o || {}; var max = o.max || 100;
    var box = el('div', { class: 'ch-hbars' });
    rows.forEach(function (r) {
      var row = el('div', { class: 'ch-hrow' + (r.muted ? ' muted' : '') + (r.onClick ? ' click' : '') + (r.ok ? ' ok' : '') });
      var w = Math.max(0, Math.min(100, (Number(r.value) || 0) / max * 100));
      row.innerHTML = '<span class="ch-hl" title="' + esc(r.label) + '">' + esc(r.label) + '</span><span class="ch-ht"><i style="width:' + w + '%"></i>' +
        (o.target ? '<b class="ch-tg" style="left:' + (o.target / max * 100) + '%" title="เกณฑ์ ' + o.target + (o.unit || '') + '"></b>' : '') + '</span><span class="ch-hv">' + esc(r.text !== undefined ? r.text : fmt(r.value) + (o.unit || '')) + '</span>';
      bindTip(row, r.tip || ('<b>' + esc(r.label) + '</b><br>' + esc(fmt(r.value) + (o.unit || ''))));
      if (r.onClick) { row.tabIndex = 0; row.onclick = r.onClick; row.onkeydown = function (e) { if (e.key === 'Enter') r.onClick(); }; }
      box.appendChild(row);
    });
    host.appendChild(box);
    return box;
  }
  /** แท่งแนวตั้ง data: [{ label, value, title }] */
  function columns(host, data, o) {
    o = o || {};
    var max = o.max || niceMax(Math.max.apply(null, data.map(function (d) { return d.value; }).concat([1])));
    var wrap = el('div', { class: 'ch-colwrap' });
    var grid = el('div', { class: 'ch-cols', style: 'grid-template-columns:repeat(' + data.length + ',1fr);height:' + (o.height || 150) + 'px' });
    var every = o.labelEvery || Math.max(1, Math.ceil(data.length / 7));
    data.forEach(function (d, i) {
      var c = el('div', { class: 'ch-col', tabindex: '0' });
      var bar = el('i'); bar.style.height = (d.value / max * 100) + '%'; if (!d.value) bar.className = 'zero';
      c.appendChild(bar);
      bindTip(c, '<b>' + esc(d.title || d.label) + '</b><br>' + esc(fmt(d.value) + ' ' + (o.unit || '')));
      grid.appendChild(c);
    });
    var axis = el('div', { class: 'ch-xs', style: 'grid-template-columns:repeat(' + data.length + ',1fr)' });
    data.forEach(function (d, i) { axis.appendChild(el('span', {}, (i % every === 0 || i === data.length - 1) ? d.label : '')); });
    wrap.appendChild(el('div', { class: 'ch-ymax' }, fmt(max) + (o.unit ? ' ' + o.unit : '')));
    wrap.appendChild(grid); wrap.appendChild(axis);
    host.appendChild(wrap);
    if (o.table !== false) tableToggle(host, [o.xName || 'รายการ', o.yName || 'ค่า'], data.map(function (d) { return [d.title || d.label, fmt(d.value)]; }));
    return wrap;
  }
  /** กราฟเส้น+พื้นที่ (แนวโน้มรายวัน) พร้อมเส้นชี้ตำแหน่ง */
  function area(host, data, o) {
    o = o || {};
    var box = el('div', { class: 'ch-area' }); host.appendChild(box);
    function draw() {
      var W = Math.max(240, box.clientWidth || host.clientWidth || 600), H = o.height || 150, P = { l: 28, r: 10, t: 12, b: 22 };
      var max = niceMax(Math.max.apply(null, data.map(function (d) { return d.value; }).concat([1])));
      var X = function (i) { return P.l + (data.length < 2 ? 0 : i * (W - P.l - P.r) / (data.length - 1)); };
      var Y = function (v) { return P.t + (H - P.t - P.b) * (1 - v / max); };
      var line = data.map(function (d, i) { return (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(d.value).toFixed(1); }).join(' ');
      var fill = line + ' L' + X(data.length - 1).toFixed(1) + ' ' + Y(0) + ' L' + X(0) + ' ' + Y(0) + ' Z';
      var g = '';
      [0, .5, 1].forEach(function (f) { var y = Y(max * f); g += '<line x1="' + P.l + '" x2="' + (W - P.r) + '" y1="' + y + '" y2="' + y + '" class="gl"/><text x="' + (P.l - 6) + '" y="' + (y + 4) + '" class="yl" text-anchor="end">' + fmt(max * f) + '</text>'; });
      var every = Math.max(1, Math.ceil(data.length / 6));
      data.forEach(function (d, i) { if (i % every === 0 || i === data.length - 1) g += '<text x="' + X(i) + '" y="' + (H - 6) + '" class="xl" text-anchor="' + (i === 0 ? 'start' : i === data.length - 1 ? 'end' : 'middle') + '">' + esc(d.label) + '</text>'; });
      box.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '" role="img" aria-label="' + esc(o.aria || 'กราฟแนวโน้ม') + '">' + g +
        '<path d="' + fill + '" class="af"/><path d="' + line + '" class="al"/><line class="cx" y1="' + P.t + '" y2="' + Y(0) + '" x1="-9" x2="-9"/><circle class="cd" r="5" cx="-9" cy="-9"/><rect x="' + P.l + '" y="0" width="' + (W - P.l - P.r) + '" height="' + H + '" fill="transparent" class="hit"/></svg>';
      var svg = box.firstChild, hit = svg.querySelector('.hit'), cx = svg.querySelector('.cx'), cd = svg.querySelector('.cd');
      function at(clientX) {
        var r = svg.getBoundingClientRect(), x = (clientX - r.left) * (W / r.width);
        var i = Math.max(0, Math.min(data.length - 1, Math.round((x - P.l) / ((W - P.l - P.r) / Math.max(1, data.length - 1)))));
        cx.setAttribute('x1', X(i)); cx.setAttribute('x2', X(i)); cd.setAttribute('cx', X(i)); cd.setAttribute('cy', Y(data[i].value));
        return '<b>' + esc(data[i].title || data[i].label) + '</b><br>' + esc(fmt(data[i].value) + ' ' + (o.unit || ''));
      }
      bindTip(hit, function (e) { return at(e.clientX); });
      hit.addEventListener('mouseleave', function () { cx.setAttribute('x1', -9); cx.setAttribute('x2', -9); cd.setAttribute('cx', -9); });
    }
    draw();
    if (window.ResizeObserver) { var t; new ResizeObserver(function () { clearTimeout(t); t = setTimeout(draw, 120); }).observe(box); }
    if (o.table !== false) tableToggle(host, [o.xName || 'วันที่', o.yName || 'จำนวน'], data.map(function (d) { return [d.title || d.label, fmt(d.value)]; }));
    return box;
  }
  /** โดนัท segs: [{ label, value, cls }] cls = ok | wait | muted | pri */
  function donut(host, segs, o) {
    o = o || {};
    var total = segs.reduce(function (s, x) { return s + x.value; }, 0);
    var R = 46, C = 2 * Math.PI * R, off = 0, gap = total && segs.filter(function (x) { return x.value; }).length > 1 ? 2 : 0;
    var arcs = segs.map(function (x, i) {
      var len = total ? x.value / total * C : 0, s = '<circle r="' + R + '" cx="60" cy="60" class="seg ' + (x.cls || 'pri') + '" data-i="' + i + '" stroke-dasharray="' + Math.max(0, len - gap).toFixed(2) + ' ' + C.toFixed(2) + '" stroke-dashoffset="' + (-off).toFixed(2) + '"/>';
      off += len; return s;
    }).join('');
    var w = el('div', { class: 'ch-donut' });
    w.innerHTML = '<svg viewBox="0 0 120 120" role="img" aria-label="' + esc(o.aria || '') + '"><circle r="' + R + '" cx="60" cy="60" class="track"/><g transform="rotate(-90 60 60)">' + arcs + '</g>' +
      '<text x="60" y="58" text-anchor="middle" class="c1">' + esc(o.center !== undefined ? o.center : total) + '</text><text x="60" y="76" text-anchor="middle" class="c2">' + esc(o.sub || '') + '</text></svg>';
    var lg = el('ul', { class: 'ch-legend' });
    segs.forEach(function (x) { lg.appendChild(el('li', { class: x.cls || 'pri' })).innerHTML = '<i></i>' + esc(x.label) + ' <b>' + fmt(x.value) + '</b>' + (total ? ' <span class="muted">(' + Math.round(x.value / total * 100) + '%)</span>' : ''); });
    w.appendChild(lg);
    $$('circle.seg', w).forEach(function (c) { var x = segs[Number(c.getAttribute('data-i'))]; bindTip(c, '<b>' + esc(x.label) + '</b><br>' + fmt(x.value) + (total ? ' (' + Math.round(x.value / total * 100) + '%)' : '')); });
    host.appendChild(w);
    return w;
  }
  /** การ์ดกราฟพร้อมหัวข้อ */
  function card(title, sub, cls) {
    var c = el('div', { class: 'card ch-card ' + (cls || '') });
    c.innerHTML = '<div class="ch-head"><h3>' + esc(title) + '</h3>' + (sub ? '<span class="small muted">' + esc(sub) + '</span>' : '') + '</div>';
    return c;
  }
  /** แถว KPI: [{ label, value, sub, icon, tone }] */
  function kpis(host, list) {
    var k = el('div', { class: 'kpis' });
    list.forEach(function (x) {
      var c = el('div', { class: 'kpi' + (x.tone ? ' ' + x.tone : '') });
      c.innerHTML = (x.icon ? '<span class="kpi-ic" aria-hidden="true">' + x.icon + '</span>' : '') + '<span>' + esc(x.label) + '</span><b>' + esc(x.value) + '</b><span class="small">' + esc(x.sub || '') + '</span>';
      k.appendChild(c);
    });
    host.appendChild(k);
    return k;
  }
  /** วันที่ 'YYYY-MM-DD' → '14 พ.ย.' */
  function dayLabel(d) { var x = new Date(d + 'T00:00:00'); return isNaN(x) ? d : x.toLocaleDateString('th-TH', { day: 'numeric', month: 'short' }); }
  return { hbars: hbars, columns: columns, area: area, donut: donut, card: card, kpis: kpis, dayLabel: dayLabel, tip: bindTip };
})();

/* ข้อความที่คัดลอกจากภายในระบบเอง (เช่น โจทย์ ใบความรู้) วางในพื้นที่ทำงานได้ */
document.addEventListener('copy', function () { try { if (window.ClipGuard) ClipGuard.remember(String(window.getSelection() || '')); } catch (e) {} }, true);

function applyTheme(settings) {
  if (settings && /^#[0-9a-f]{6}$/i.test(settings.primaryColor || '')) document.documentElement.style.setProperty('--primary', settings.primaryColor);
}
</script>
