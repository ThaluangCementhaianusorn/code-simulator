<style>
:root {
  --primary: #4F46E5; --primary-ink: #ffffff; --primary-soft: #EEF2FF; --accent2: #EC4899;
  --accent: #F59E0B; --ok: #059669; --ok-soft: #D1FAE5; --wait: #D97706; --wait-soft: #FEF3C7; --bad: #DC2626; --bad-soft: #FEE2E2;
  --bg: #F5F6FB; --card: #ffffff; --ink: #0F172A; --muted: #64748B; --line: #E2E8F0; --soft: #F8FAFC;
  --code-bg: #0F172A; --code-ink: #E2E8F0; --console-bg: #111827; --console-ink: #D1FAE5;
  --gold: #D4A017; --silver: #94A3B8; --bronze: #B45309;
  --radius: 18px; --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.06);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --primary-soft: #1E293B; --bg: #0B1120; --card: #111827; --ink: #E5E7EB; --muted: #94A3B8; --line: #1F2937; --soft: #0F172A;
    --ok-soft: #064E3B; --wait-soft: #451A03; --bad-soft: #450A0A; --code-bg: #020617; --console-bg: #020617;
  }
}
:root[data-theme="dark"] {
  --primary-soft: #1E293B; --bg: #0B1120; --card: #111827; --ink: #E5E7EB; --muted: #94A3B8; --line: #1F2937; --soft: #0F172A;
  --ok-soft: #064E3B; --wait-soft: #451A03; --bad-soft: #450A0A; --code-bg: #020617; --console-bg: #020617;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--ink); font-family: 'Sarabun', system-ui, sans-serif; font-size: 16px; line-height: 1.6; -webkit-text-size-adjust: 100%; }
h1, h2, h3, h4, .brand, .btn, .chip, .kpi b, .tab { font-family: 'Prompt', 'Sarabun', sans-serif; }
h1 { font-size: 1.45rem; margin: .2em 0 .4em; line-height: 1.3; }
h2 { font-size: 1.2rem; margin: 1.2em 0 .5em; line-height: 1.35; }
h3 { font-size: 1.05rem; margin: 1em 0 .4em; }
a { color: var(--primary); }
code, pre, textarea.mono, .mono { font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
:not(pre) > code { background: var(--primary-soft); padding: .05em .35em; border-radius: 6px; font-size: .92em; }
.hidden { display: none !important; }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 auto; }
.right { margin-left: auto; }
.center { text-align: center; }

/* ---------- โครงหน้า ---------- */
.topbar { position: sticky; top: 0; z-index: 30; background: linear-gradient(120deg, var(--primary), color-mix(in srgb, var(--primary) 55%, var(--accent2))); box-shadow: 0 4px 18px rgba(79,70,229,.25); color: var(--primary-ink); display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 56px; }
.topbar .brand { font-weight: 600; font-size: 1rem; line-height: 1.2; }
.topbar .brand small { display: block; font-family: 'Sarabun'; font-weight: 400; opacity: .85; font-size: .78rem; }
.topbar .back { background: rgba(255,255,255,.15); border: 0; color: inherit; width: 40px; height: 40px; border-radius: 10px; font-size: 1.2rem; cursor: pointer; }
.topbar .who { margin-left: auto; font-size: .85rem; opacity: .95; text-align: right; line-height: 1.2; }
.wrap { max-width: 920px; margin: 0 auto; padding: 16px 16px 110px; }
.wrap.wide { max-width: 1240px; }
.bottomnav { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: flex; background: var(--card); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
.bottomnav button { flex: 1; border: 0; background: none; color: var(--muted); padding: 8px 2px 10px; font: 500 .74rem 'Prompt', sans-serif; cursor: pointer; min-height: 56px; }
.bottomnav button .i { display: block; font-size: 1.3rem; line-height: 1.3; }
.bottomnav button.on { color: var(--primary); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .bottomnav button.on { color: #93C5FD; } }

/* หลังบ้าน: sidebar บนจอคอม */
.t-layout { display: block; }
.sidebar { display: none; }
@media (min-width: 960px) {
  .t-layout { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 56px); }
  .sidebar { display: block; background: var(--card); border-right: 1px solid var(--line); padding: 12px; position: sticky; top: 56px; height: calc(100vh - 56px); }
  .sidebar button { display: flex; gap: 10px; align-items: center; width: 100%; border: 0; background: none; padding: 12px; border-radius: 10px; font: 500 .95rem 'Prompt'; color: var(--ink); cursor: pointer; text-align: left; }
  .sidebar button.on { background: var(--primary-soft); color: var(--primary); }
  .t-layout .bottomnav { display: none; }
  .t-layout .wrap { padding-bottom: 40px; }
}

/* ---------- การ์ด ปุ่ม ฟอร์ม ---------- */
.card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; border: 1px solid var(--line); }
.card.flat { box-shadow: none; }
.card h2:first-child, .card h3:first-child { margin-top: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 48px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: .95rem; font-weight: 500; cursor: pointer; text-decoration: none; white-space: nowrap; }
.btn:hover { filter: brightness(.97); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: linear-gradient(135deg, var(--primary), color-mix(in srgb, var(--primary) 70%, var(--accent2))); border-color: transparent; color: var(--primary-ink); box-shadow: 0 4px 14px rgba(79,70,229,.28); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #fff; }
.btn.warn { background: var(--accent); border-color: var(--accent); color: #111827; }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: .85rem; border-radius: 10px; }
.btn.block { width: 100%; }
.btn .spin { width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
label.f { display: block; font-weight: 600; margin: 10px 0 4px; font-size: .92rem; }
input.in, select.in, textarea.in { width: 100%; font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); min-height: 48px; }
textarea.in { min-height: 90px; resize: vertical; }
input.in:focus, select.in:focus, textarea.in:focus { outline: 2px solid var(--primary); outline-offset: 1px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px; font-size: .78rem; font-weight: 500; background: var(--soft); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.chip.wait { background: var(--wait-soft); color: var(--wait); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.pri { background: var(--primary-soft); color: var(--primary); border-color: transparent; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .chip.ok { color: #6EE7B7; } :root:not([data-theme="light"]) .chip.wait { color: #FCD34D; } :root:not([data-theme="light"]) .chip.bad { color: #FCA5A5; } :root:not([data-theme="light"]) .chip.pri { color: #93C5FD; } }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.chips button.chip { cursor: pointer; min-height: 36px; padding: 0 14px; font-size: .85rem; }
.chips button.chip.on { background: var(--primary); color: #fff; border-color: var(--primary); }
.bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--primary); border-radius: 99px; transition: width .4s; }
.bar.ok > i { background: var(--ok); }
.empty { text-align: center; padding: 32px 16px; color: var(--muted); }
.empty .i { font-size: 2.4rem; display: block; }

/* ---------- toast / modal ---------- */
#toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; width: min(92vw, 420px); pointer-events: none; }
#toast div { background: #111827; color: #fff; padding: 12px 16px; border-radius: 12px; box-shadow: var(--shadow); animation: up .25s; font-size: .95rem; }
#toast div.ok { background: var(--ok); } #toast div.bad { background: var(--bad); }
@keyframes up { from { transform: translateY(10px); opacity: 0; } }
.modal-bg { position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 80; display: flex; align-items: flex-end; justify-content: center; }
.modal { background: var(--card); color: var(--ink); width: 100%; max-width: 640px; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 18px 16px 24px; animation: up .25s; }
@media (min-width: 700px) { .modal-bg { align-items: center; } .modal { border-radius: 18px; } }
.modal .x { float: right; border: 0; background: var(--soft); width: 40px; height: 40px; border-radius: 10px; font-size: 1.1rem; cursor: pointer; color: var(--ink); }

/* ---------- ผู้เรียน: ภารกิจ ---------- */
.hero { display: flex; gap: 16px; align-items: center; }
.ring { --p: 0; width: 92px; height: 92px; border-radius: 50%; flex: none; display: grid; place-items: center; background: conic-gradient(var(--ok) calc(var(--p) * 1%), var(--line) 0); }
.ring span { width: 72px; height: 72px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font: 600 1.15rem 'Prompt'; }
.mission { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; cursor: pointer; position: relative; }
.mission .badge { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; font-size: 1.7rem; background: var(--primary-soft); }
.mission.locked { opacity: .6; cursor: not-allowed; }
.mission.locked .badge { filter: grayscale(1); }
.mission.passed .badge { background: var(--ok-soft); }
.mission .no { font: 500 .75rem 'Prompt'; color: var(--muted); }
.mission h3 { margin: 0 0 2px; }
.medal { font-size: 1.4rem; }
.acts .act { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 8px; cursor: pointer; background: var(--card); min-height: 64px; }
.acts .act:hover { border-color: var(--primary); }
.acts .act .ti { font-size: 1.5rem; width: 40px; text-align: center; }
.acts .act .tt { flex: 1; min-width: 0; }
.acts .act .tt b { display: block; font-family: 'Prompt'; font-weight: 500; }

/* ---------- Markdown ---------- */
.md p { margin: .5em 0; }
.md ul, .md ol { padding-left: 1.4em; margin: .4em 0; }
.md blockquote { margin: .8em 0; padding: 10px 14px; border-left: 4px solid var(--accent); background: var(--wait-soft); border-radius: 0 10px 10px 0; }
.md table { border-collapse: collapse; width: 100%; margin: .6em 0; font-size: .93rem; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.md th { background: var(--soft); font-family: 'Prompt'; font-weight: 500; }
.md img { max-width: 100%; border-radius: 10px; }
pre.code { background: var(--code-bg); color: var(--code-ink); padding: 12px 14px; border-radius: 10px; overflow-x: auto; font-size: .9rem; line-height: 1.5; margin: .6em 0; white-space: pre; }

/* ---------- ตัวจำลอง ---------- */
.sim { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin: .8em 0; background: var(--card); }
.sim .ed { border-bottom: 1px solid var(--line); }
.sim .CodeMirror { height: auto; min-height: 90px; font-size: 15px; line-height: 1.55; font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace; }
.sim .CodeMirror-scroll { min-height: 90px; max-height: 420px; }
.sim textarea.fallback { width: 100%; min-height: 160px; border: 0; padding: 10px; font-size: 15px; background: var(--soft); color: var(--ink); resize: vertical; }
.sim .tools { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px; background: var(--soft); align-items: center; }
.sim .tools .btn { min-height: 40px; padding: 0 12px; font-size: .88rem; }
.sim .keys { display: flex; gap: 4px; overflow-x: auto; padding: 6px 8px; background: var(--soft); border-bottom: 1px solid var(--line); }
.sim .keys button { flex: none; min-width: 38px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 600 15px ui-monospace, Consolas, monospace; cursor: pointer; }
.sim .stdin { padding: 8px; border-bottom: 1px solid var(--line); }
.sim .stdin textarea { min-height: 54px; font-size: 15px; }
.sim .console { background: var(--console-bg); color: var(--console-ink); font: 14px/1.5 'JetBrains Mono', ui-monospace, Consolas, monospace; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; min-height: 44px; max-height: 320px; overflow: auto; }
.sim .console .err { color: #FCA5A5; }
.sim .console .info { color: #93C5FD; }
.sim .console .th { color: #FDE68A; display: block; margin-top: 6px; font-family: 'Sarabun', sans-serif; font-size: 15px; }
.cm-run-line { background: rgba(245,158,11,.28) !important; }
.cm-err-line { background: rgba(220,38,38,.22) !important; }
.trace { padding: 10px; border-top: 1px solid var(--line); background: var(--soft); }
.trace .ctl { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.trace .ctl button { min-width: 44px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 1rem; cursor: pointer; }
.trace input[type=range] { flex: 1; min-width: 120px; }
.trace table { width: 100%; border-collapse: collapse; font-size: .9rem; margin-top: 8px; }
.trace td, .trace th { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.trace td.v { font-family: ui-monospace, Consolas, monospace; }
.trace tr.chg td { background: var(--wait-soft); }
.loadbar { font-size: .85rem; color: var(--muted); padding: 6px 10px; }
.tests { width: 100%; border-collapse: collapse; font-size: .9rem; margin: 8px 0; }
.tests th, .tests td { border: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: top; }
.tests th { background: var(--soft); font-family: 'Prompt'; font-weight: 500; }
.tests pre { margin: 0; white-space: pre-wrap; font-size: .85rem; }
.pass { color: var(--ok); font-weight: 700; } .fail { color: var(--bad); font-weight: 700; }
.hints li { background: var(--wait-soft); padding: 8px 12px; border-radius: 10px; margin: 6px 0; list-style: none; }
.hints { padding: 0; }
.sticky-foot { position: sticky; bottom: 64px; z-index: 20; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px; box-shadow: var(--shadow); display: flex; gap: 8px; align-items: center; }

/* ---------- แบบทดสอบ ---------- */
.timer { position: sticky; top: 56px; z-index: 25; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; margin-bottom: 12px; box-shadow: var(--shadow); }
.timer b { font: 600 1.25rem 'Prompt'; font-variant-numeric: tabular-nums; }
.timer.low b { color: var(--bad); }
.q { scroll-margin-top: 130px; }
.q .qn { font: 600 .85rem 'Prompt'; color: var(--primary); }
.opt { display: flex; gap: 10px; align-items: center; padding: 12px; border: 1px solid var(--line); border-radius: 12px; margin: 6px 0; cursor: pointer; min-height: 52px; background: var(--card); }
.opt input { width: 20px; height: 20px; accent-color: var(--primary); flex: none; }
.opt.on { border-color: var(--primary); background: var(--primary-soft); }
.qres { border-left: 4px solid var(--line); padding: 8px 12px; margin: 8px 0; border-radius: 0 10px 10px 0; background: var(--soft); }
.qres.ok { border-color: var(--ok); } .qres.bad { border-color: var(--bad); }

/* ---------- ตาราง (หลังบ้าน) ---------- */
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.tbl th, table.tbl td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
table.tbl th { font-family: 'Prompt'; font-weight: 500; background: var(--soft); position: sticky; top: 0; }
table.tbl tr.click { cursor: pointer; } table.tbl tr.click:hover td { background: var(--soft); }
table.tbl td.num, table.tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
@media (min-width: 760px) { .kpis { grid-template-columns: repeat(4, 1fr); } }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
.kpi b { display: block; font-size: 1.7rem; font-weight: 600; color: var(--primary); line-height: 1.2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .kpi b { color: #93C5FD; } }
.kpi span { color: var(--muted); font-size: .85rem; }
.grid2 { display: grid; gap: 14px; } @media (min-width: 860px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.only-desk { display: none; } @media (min-width: 760px) { .only-desk { display: block; } .only-mobile { display: none; } }

/* ---------- เกียรติบัตร ---------- */
.cert-list { display: grid; gap: 12px; } @media (min-width: 700px) { .cert-list { grid-template-columns: 1fr 1fr; } }
.cert-card { display: flex; gap: 12px; align-items: center; cursor: pointer; }
.cert-card .medal { font-size: 2.2rem; }
.cert-stage { overflow: hidden; }
.cert { --c: var(--primary); position: relative; width: 1123px; height: 794px; background: #fffdf7; color: #1f2937; transform-origin: top left; font-family: 'Sarabun', sans-serif; }
.cert .frame { position: absolute; inset: 22px; border: 3px solid var(--c); border-radius: 6px; }
.cert .frame::after { content: ''; position: absolute; inset: 10px; border: 1.5px solid #D4A017; border-radius: 4px; }
.cert .corner { position: absolute; width: 120px; height: 120px; background: radial-gradient(circle at 0 0, var(--c) 0 38%, transparent 39%); opacity: .12; }
.cert .inner { position: absolute; inset: 56px 80px; display: flex; flex-direction: column; align-items: center; text-align: center; }
.cert .logo { height: 92px; max-width: 160px; object-fit: contain; margin-bottom: 2px; }
.cert .emblem { width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; font-size: 42px; background: #FEF3C7; border: 3px solid #D4A017; }
.cert .school { font: 500 22px 'Prompt'; margin-top: 8px; }
.cert .title { font: 700 58px 'Prompt'; color: var(--c); letter-spacing: 2px; line-height: 1.1; margin: 8px 0 2px; }
.cert .given { font-size: 20px; color: #4b5563; }
.cert .name { font: 600 40px 'Prompt'; margin: 6px 0 0; border-bottom: 2px dotted #9ca3af; padding: 0 40px 4px; }
.cert .meta { font-size: 18px; color: #4b5563; margin-top: 4px; }
.cert .what { font-size: 22px; margin-top: 12px; line-height: 1.5; }
.cert .what b { font-family: 'Prompt'; font-weight: 600; color: var(--c); }
.cert .level { display: inline-flex; gap: 8px; align-items: center; margin-top: 10px; padding: 6px 22px; border-radius: 99px; font: 600 20px 'Prompt'; color: #fff; }
.cert .level.gold { background: linear-gradient(90deg, #B8860B, #E6B422); } .cert .level.silver { background: linear-gradient(90deg, #64748B, #A0AEC0); } .cert .level.bronze { background: linear-gradient(90deg, #92400E, #C2722B); }
.cert .date { font-size: 18px; margin-top: 10px; }
.cert .signs { display: flex; gap: 120px; margin-top: auto; justify-content: center; }
.cert .sign { width: 260px; font-size: 17px; }
.cert .sign .ln { border-top: 1.5px solid #374151; margin-bottom: 4px; height: 50px; border-top: 0; border-bottom: 1.5px solid #374151; }
.cert .foot { position: absolute; left: 80px; right: 80px; bottom: 40px; display: flex; justify-content: space-between; align-items: flex-end; font-size: 13px; color: #6b7280; }
.cert .qr { width: 78px; height: 78px; background: #fff; padding: 3px; }
.cert .qr img, .cert .qr canvas { width: 72px !important; height: 72px !important; }
@media print {
  @page { size: A4 landscape; margin: 0; }
  body { background: #fff !important; }
  body * { visibility: hidden; }
  .print-area, .print-area * { visibility: visible; }
  .print-area { position: fixed; left: 0; top: 0; }
  .print-area .cert { transform: none !important; }
  .cert-stage { height: auto !important; overflow: visible !important; }
  .slips, .slips * { visibility: visible; }
}
.slip { border: 1px dashed #94a3b8; padding: 10px; border-radius: 8px; break-inside: avoid; }
.slips { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }

/* ---------- หน้าแรก (Landing) ---------- */
.land-hero { position: relative; overflow: hidden; display: grid; grid-template-columns: 1fr; gap: 16px; align-items: center; border-radius: 24px; padding: 24px 20px; margin-bottom: 16px; color: #fff;
  background: radial-gradient(circle at 85% 15%, rgba(236,72,153,.55), transparent 45%), radial-gradient(circle at 10% 90%, rgba(34,211,238,.45), transparent 40%), linear-gradient(135deg, #312E81, var(--primary)); box-shadow: 0 18px 40px rgba(49,46,129,.3); }
.land-hero h1 { font-size: 1.9rem; margin: .3em 0; letter-spacing: .2px; }
.land-hero p { opacity: .9; margin: 0 0 12px; font-size: .98rem; }
.land-hero.compact { padding: 18px; } .land-hero.compact h1 { font-size: 1.4rem; }
.land-tags, .land-stack { display: flex; flex-wrap: wrap; gap: 6px; }

  .lp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; } .lp-grid b { height: 48px; border-radius: 10px; background: #FCE7F3; } .lp-grid b:nth-child(2n) { background: #CFFAFE; }
  .lp-code { margin-top: auto; background: #282A36; color: #50FA7B; border-radius: 10px; padding: 8px; font: 10px/1.5 'JetBrains Mono', monospace; }
}

.hero-grad .ring { background: conic-gradient(#34D399 calc(var(--p) * 1%), rgba(255,255,255,.25) 0); } .hero-grad .ring span { background: color-mix(in srgb, var(--primary) 85%, #000); color: #fff; }
.showcase-cta { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; cursor: pointer; font: inherit; color: var(--ink); }
.showcase-cta .i { font-size: 2rem; } .showcase-cta:hover { border-color: var(--primary); }
.mission { transition: transform .15s, box-shadow .15s; } .mission:not(.locked):hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(79,70,229,.14); }
.mission .badge { background: linear-gradient(135deg, var(--primary-soft), #FCE7F3); }

/* ---------- แกลเลอรีระบบตัวอย่าง ---------- */
.sc-grid { display: grid; gap: 12px; } @media (min-width: 640px) { .sc-grid { grid-template-columns: repeat(2, 1fr); } } @media (min-width: 1000px) { .sc-grid { grid-template-columns: repeat(3, 1fr); } }
.sc-card { text-align: left; font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 16px; cursor: pointer; box-shadow: var(--shadow); transition: transform .15s, border-color .15s; }
.sc-card:hover { transform: translateY(-3px); border-color: var(--primary); }
.sc-card b { font: 600 1.05rem 'Prompt'; display: block; } .sc-card p { color: var(--muted); font-size: .9rem; margin: 4px 0 8px; }
.sc-ic { font-size: 2.2rem; width: 60px; height: 60px; border-radius: 18px; display: grid; place-items: center; background: linear-gradient(135deg, var(--primary-soft), #FCE7F3); margin-bottom: 8px; }
.sc-no { font: 500 .75rem 'Prompt'; color: var(--primary); }
.sc-tags { display: flex; flex-wrap: wrap; gap: 4px; } .sc-tags span { font: 600 .72rem 'JetBrains Mono', monospace; padding: 2px 8px; border-radius: 6px; background: var(--primary-soft); color: var(--primary); }

/* ---------- ตัวจำลองเว็บ + หน้าจอมือถือ ---------- */
.wsim { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; margin: .9em 0; background: var(--card); box-shadow: var(--shadow); }
.wsim-seg { display: flex; padding: 6px; gap: 6px; background: var(--soft); border-bottom: 1px solid var(--line); }
.wsim-seg button { flex: 1; border: 0; border-radius: 10px; padding: 9px; font: 500 .9rem 'Prompt'; background: transparent; color: var(--muted); cursor: pointer; }
.wsim-seg button.on { background: var(--card); color: var(--primary); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
.wsim-grid { display: block; }
.wsim[data-view="code"] .wsim-view, .wsim[data-view="view"] .wsim-code { display: none; }
@media (min-width: 900px) {
  .wsim-seg { display: none; }
  .wsim-grid { display: grid; grid-template-columns: minmax(0, 1fr) 360px; }

  .wsim-code { border-right: 1px solid var(--line); }
}
.wsim-code { background: #282A36; min-width: 0; }

.wsim-head .dots i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; background: #FF5F57; } .wsim-head .dots i:nth-child(2) { background: #FEBC2E; } .wsim-head .dots i:nth-child(3) { background: #28C840; }
.wsim .keys { display: flex; gap: 4px; overflow-x: auto; padding: 6px 8px; background: #21222C; }
.wsim .keys button { flex: none; min-width: 36px; height: 34px; border-radius: 8px; border: 1px solid #44475A; background: #343746; color: #F8F8F2; font: 600 15px 'JetBrains Mono', monospace; cursor: pointer; }
.wsim .CodeMirror { height: auto; font: 14px/1.6 'JetBrains Mono', ui-monospace, Consolas, monospace; }
.wsim .CodeMirror-scroll { min-height: 260px; max-height: 560px; }
.wsim textarea.fallback { width: 100%; min-height: 300px; border: 0; padding: 10px; font: 14px 'JetBrains Mono', monospace; background: #282A36; color: #F8F8F2; }
.wsim-view { background: radial-gradient(circle at 50% 0, var(--primary-soft), var(--soft) 70%); padding: 10px 12px 12px; min-width: 0; }
.wsim-dev { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
.wsim-dev button { border: 1px solid var(--line); background: var(--card); border-radius: 8px; width: 36px; height: 32px; cursor: pointer; font-size: 15px; }
.wsim-dev button.on { border-color: var(--primary); background: var(--primary-soft); }
.wsim-dev .url { flex: 1; min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; font-size: .8rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.phone { margin: 0 auto; width: max-content; padding: 10px 10px 14px; border-radius: 36px; background: #0F172A; box-shadow: 0 18px 40px rgba(15,23,42,.35), inset 0 0 0 2px #334155; }
.phone .sbar { display: flex; justify-content: space-between; align-items: center; color: #E2E8F0; font-size: 11px; padding: 2px 16px 6px; }
.phone .notch { width: 70px; height: 18px; border-radius: 0 0 12px 12px; background: #000; margin-top: -4px; }
.phone .screen { overflow: hidden; border-radius: 22px; background: #fff; position: relative; }
.phone iframe { border: 0; display: block; background: #fff; transform-origin: top left; }
.phone.desk { border-radius: 14px; padding: 8px; width: 100%; } .phone.desk .sbar { display: none; } .phone.desk .screen { border-radius: 6px; }
.wcon { margin-top: 10px; background: #0F172A; color: #E2E8F0; border-radius: 12px; font: 12.5px/1.5 'JetBrains Mono', ui-monospace, monospace; padding: 8px 10px; min-height: 44px; max-height: 200px; overflow: auto; }
.wsim .wcon .ln { padding: 2px 0; border-bottom: 1px solid #1E293B; white-space: pre-wrap; word-break: break-word; }
.wcon .pf { color: #64748B; margin-right: 6px; } .wcon .ph { color: #64748B; }
.wcon .error { color: #FCA5A5; } .wcon .warn { color: #FCD34D; } .wcon .net { color: #93C5FD; }
.wcon .th { display: block; color: #FDE68A; font: 14px 'Sarabun', sans-serif; margin-top: 2px; }
.wcon .st { padding: 0 6px; border-radius: 4px; } .wcon .s2 { background: #065F46; } .wcon .s4, .wcon .s5 { background: #7F1D1D; }
.wsim > .tools { display: flex; gap: 6px; flex-wrap: wrap; padding: 8px; background: var(--soft); border-top: 1px solid var(--line); align-items: center; }
.wsim > .tools .btn { min-height: 40px; padding: 0 12px; font-size: .88rem; }
.wsim .live { display: inline-flex; align-items: center; gap: 4px; font: 500 .85rem 'Prompt'; padding: 0 8px; cursor: pointer; }
.wsim .live input { accent-color: var(--primary); width: 18px; height: 18px; }
.wide .wsim-grid { grid-template-columns: minmax(0, 1fr) 380px; }
.checklist { list-style: none; padding: 0; margin: 6px 0; }
.checklist li { position: relative; padding: 6px 10px 6px 34px; border-radius: 10px; background: var(--soft); margin: 4px 0; font-size: .93rem; }
.checklist li::before { content: attr(data-s); position: absolute; left: 10px; top: 6px; }
.checklist li[data-s=""]::before { content: '◻️'; }

/* ================= v2.1: โฉมใหม่ แดชบอร์ด กราฟ กันทุจริต ฐานข้อมูล ================= */
:root { --c-ok: #1baf7a; --c-wait: #eda100; --c-muted: #CBD5E1; --c-gold: #D4A017; --c-silver: #94A3B8; --c-bronze: #B45309; --grid: #E2E8F0; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --c-ok: #199e70; --c-wait: #c98500; --c-muted: #334155; --grid: #1F2937; } }
:root[data-theme="dark"] { --c-ok: #199e70; --c-wait: #c98500; --c-muted: #334155; --grid: #1F2937; }
body { background: radial-gradient(1200px 500px at 100% -10%, color-mix(in srgb, var(--primary) 9%, transparent), transparent 60%), var(--bg); background-attachment: fixed; }
.topbar { backdrop-filter: saturate(1.4) blur(8px); }
.card { transition: box-shadow .2s, border-color .2s; }
.wrap.wide { max-width: 1440px; }
@media (min-width: 1200px) { .wrap.wide { padding-left: 28px; padding-right: 28px; } }

/* ----- หน้าแรกเต็มจอ ----- */
.wrap.land { max-width: none; padding: 0 0 110px; }
.land-full { position: relative; overflow: hidden; display: grid; gap: 22px; align-items: center; min-height: calc(100vh - 56px); min-height: calc(100svh - 56px); padding: 28px 16px 36px; color: #fff;
  background: radial-gradient(900px 500px at 85% 10%, rgba(236,72,153,.5), transparent 60%), radial-gradient(700px 500px at 5% 95%, rgba(34,211,238,.45), transparent 60%), linear-gradient(135deg, #1E1B4B, var(--primary) 70%); }
.land-full::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px); background-size: 44px 44px; mask-image: linear-gradient(180deg, #000, transparent 85%); pointer-events: none; }
.land-full > * { position: relative; z-index: 1; min-width: 0; }
.land-full { grid-template-columns: minmax(0, 1fr); } .wrap.land { overflow-x: hidden; }
.lf-text h1 { font-size: clamp(1.9rem, 4.6vw, 3.4rem); line-height: 1.15; margin: .35em 0 .3em; letter-spacing: .2px; }
.lf-text p { opacity: .92; font-size: clamp(.98rem, 1.4vw, 1.12rem); max-width: 720px; margin: 0 0 16px; }
.lf-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 22px; max-width: 720px; }
.lf-stats div { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.22); border-radius: 16px; padding: 12px 14px; backdrop-filter: blur(6px); }
.lf-stats b { display: block; font: 700 1.7rem 'Prompt'; line-height: 1.1; }
.lf-stats span { font-size: .82rem; opacity: .85; }
.login-card.glass { color: var(--ink); max-width: 440px; width: 100%; justify-self: center; border: 0; border-top: 4px solid var(--accent2); box-shadow: 0 30px 70px rgba(15,23,42,.35); }
@media (min-width: 980px) { .land-full { grid-template-columns: minmax(0, 1fr) 420px; padding: 48px max(40px, calc((100vw - 1360px) / 2)); } }
.land-feats { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); padding: 0 16px; margin: -36px auto 18px; max-width: 1360px; position: relative; z-index: 2; }
.feat { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px; box-shadow: var(--shadow); }
.feat .fi { font-size: 1.7rem; display: inline-grid; place-items: center; width: 48px; height: 48px; border-radius: 14px; background: var(--primary-soft); margin-bottom: 6px; }
.feat b { display: block; font: 600 1rem 'Prompt'; } .feat p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; }
.land > .card { max-width: 1360px; margin: 0 auto 14px; } @media (max-width: 1392px) { .land > .card { margin-left: 16px; margin-right: 16px; } }
.outline { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)) !important; }
.ol-item.bonus { background: var(--wait-soft); border-color: transparent; } .ol-item.bonus .ol-no { background: var(--accent); }

/* ----- แดชบอร์ด ----- */
.dash-grid { display: grid; gap: 14px; margin-bottom: 14px; grid-template-columns: 1fr; }
.dash-grid > .card { margin: 0; min-width: 0; }
@media (min-width: 900px) { .dash-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } .dash-grid .span2 { grid-column: span 2; } .dash-grid .span3 { grid-column: 1 / -1; } }
.ch-head { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; margin-bottom: 10px; } .ch-head h3 { margin: 0; }
.kpis { gap: 12px; } .kpis.k5 { grid-template-columns: repeat(2, 1fr); } @media (min-width: 760px) { .kpis.k5 { grid-template-columns: repeat(5, 1fr); } }
.kpi { position: relative; overflow: hidden; }
.kpi b { font-size: 1.6rem; color: var(--ink); } .kpi .small { display: block; }
.kpi-ic { position: absolute; right: 10px; top: 10px; font-size: 1.35rem; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px; background: var(--primary-soft); }
.kpi.bad { border-color: var(--bad); } .kpi.bad b { color: var(--bad); } .kpi.bad .kpi-ic { background: var(--bad-soft); }
.dash-hero { margin-bottom: 14px; }
.mission-grid { display: grid; gap: 12px; grid-template-columns: 1fr; margin-bottom: 8px; } .mission-grid .card { margin: 0; }
@media (min-width: 760px) { .mission-grid { grid-template-columns: repeat(2, 1fr); } } @media (min-width: 1200px) { .mission-grid { grid-template-columns: repeat(3, 1fr); } }
.mission.bonus .badge { background: linear-gradient(135deg, var(--wait-soft), #FDE68A); }
.cert-strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.cert-strip span { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; background: var(--soft); border: 1px dashed var(--line); font: 600 .85rem 'Prompt'; color: var(--muted); }
.cert-strip span.on { background: var(--ok-soft); border-style: solid; border-color: transparent; font-size: 1.2rem; }

/* ----- กราฟ ----- */
.ch-tip { position: fixed; z-index: 120; display: none; pointer-events: none; background: #0F172A; color: #F8FAFC; padding: 7px 10px; border-radius: 10px; font-size: .84rem; line-height: 1.4; box-shadow: 0 8px 24px rgba(0,0,0,.25); max-width: 260px; }
.ch-hbars { display: grid; gap: 4px; }
.ch-hrow { display: grid; grid-template-columns: minmax(90px, 38%) 1fr auto; gap: 10px; align-items: center; padding: 5px 6px; border-radius: 10px; font-size: .9rem; }
.ch-hrow.click { cursor: pointer; } .ch-hrow:hover { background: var(--soft); }
.ch-hrow.muted { opacity: .55; }
.ch-hl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ch-ht { position: relative; height: 12px; background: var(--soft); border-radius: 99px; border: 1px solid var(--line); }
.ch-ht i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 99px; background: var(--primary); min-width: 2px; transition: width .5s; }
.ch-hrow.ok .ch-ht i { background: var(--c-ok); }
.ch-tg { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 2px dashed var(--ink); opacity: .45; }
.ch-hv { font: 600 .85rem 'Prompt'; font-variant-numeric: tabular-nums; min-width: 48px; text-align: right; color: var(--ink); }
.ch-colwrap { position: relative; padding-top: 16px; }
.ch-ymax { position: absolute; top: 0; left: 0; font-size: .72rem; color: var(--muted); }
.ch-cols { display: grid; gap: 4px; align-items: end; border-bottom: 1px solid var(--line); background: linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 100% 50%; }
.ch-col { height: 100%; display: flex; align-items: flex-end; justify-content: center; cursor: default; border-radius: 6px; }
.ch-col:hover { background: var(--soft); }
.ch-col i { display: block; width: min(70%, 34px); background: var(--primary); border-radius: 4px 4px 0 0; min-height: 2px; transition: height .5s; }
.ch-col i.zero { background: var(--line); }
.ch-xs { display: grid; gap: 4px; font-size: .72rem; color: var(--muted); text-align: center; margin-top: 4px; } .ch-xs span { white-space: nowrap; overflow: visible; }
.ch-area svg { display: block; width: 100%; height: auto; overflow: visible; }
.ch-area .gl { stroke: var(--grid); stroke-width: 1; } .ch-area .yl, .ch-area .xl { fill: var(--muted); font-size: 11px; font-family: 'Sarabun', sans-serif; }
.ch-area .al { fill: none; stroke: var(--primary); stroke-width: 2; stroke-linejoin: round; } .ch-area .af { fill: var(--primary); opacity: .12; }
.ch-area .cx { stroke: var(--muted); stroke-dasharray: 3 3; } .ch-area .cd { fill: var(--primary); stroke: var(--card); stroke-width: 2; }
.ch-donut { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; justify-content: center; }
.ch-donut svg { width: 150px; height: 150px; flex: none; }
.ch-donut .track { fill: none; stroke: var(--soft); stroke-width: 16; }
.ch-donut .seg { fill: none; stroke-width: 16; transition: stroke-width .15s; } .ch-donut .seg:hover { stroke-width: 19; }
.ch-donut .seg.ok { stroke: var(--c-ok); } .ch-donut .seg.wait { stroke: var(--c-wait); } .ch-donut .seg.muted { stroke: var(--c-muted); } .ch-donut .seg.pri { stroke: var(--primary); }
.ch-donut .seg.gold { stroke: var(--c-gold); } .ch-donut .seg.silver { stroke: var(--c-silver); } .ch-donut .seg.bronze { stroke: var(--c-bronze); }
.ch-donut .c1 { font: 700 22px 'Prompt'; fill: var(--ink); } .ch-donut .c2 { font-size: 11px; fill: var(--muted); }
.ch-legend { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; font-size: .88rem; }
.ch-legend i { display: inline-block; width: 12px; height: 12px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; background: var(--primary); }
.ch-legend .ok i { background: var(--c-ok); } .ch-legend .wait i { background: var(--c-wait); } .ch-legend .muted i { background: var(--c-muted); }
.ch-legend .gold i { background: var(--c-gold); } .ch-legend .silver i { background: var(--c-silver); } .ch-legend .bronze i { background: var(--c-bronze); }
.ch-table { margin-top: 8px; font-size: .82rem; color: var(--muted); } .ch-table summary { cursor: pointer; }

/* ----- ความซื่อสัตย์ / กันทุจริต ----- */
.integrity { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; border-left: 4px solid var(--ok); background: var(--soft); }
.integrity.hit { border-left-color: var(--bad); background: var(--bad-soft); }
.integrity .ib-ic { font-size: 1.6rem; }
.integrity-log { border-top: 4px solid var(--bad); }
.modal.alarm { border-top: 6px solid var(--bad); animation: up .25s, shake .45s .1s; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.no-copy .card, .no-copy .opt, .no-copy pre { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.no-copy input, .no-copy textarea { -webkit-user-select: text; user-select: text; }
@media print { .no-copy { display: none !important; } }

/* ----- Google Sheet จำลอง (lang: gas) ----- */
.wsim.gas .wsim-view { background: var(--soft); }
@media (min-width: 900px) { .wsim.gas .wsim-grid, .wide .wsim.gas .wsim-grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
.gas-call { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; } .gas-call > span { white-space: nowrap; } .gas-call .in { min-height: 40px; padding: 6px 10px; font-size: 14px; }
.gsheet { border: 1px solid #C6D3E1; border-radius: 10px; overflow: hidden; background: #fff; color: #1F2937; }
.gs-wrap { overflow: auto; max-height: 340px; }
table.gs { border-collapse: collapse; font: 13px/1.3 Arial, 'Sarabun', sans-serif; min-width: 100%; }
