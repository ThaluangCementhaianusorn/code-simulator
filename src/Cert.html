    applyTheme(info);
    document.body.innerHTML = '';
    var top = el('header', { class: 'topbar' }); top.innerHTML = '<div class="brand">ตรวจสอบเกียรติบัตร<small>' + esc(info.schoolName) + '</small></div>';
    var main = el('main', { class: 'wrap wide' });
    document.body.appendChild(top); document.body.appendChild(main);
    Api.call('getCertificate', { certNo: certNo, code: code }).then(function (r) {
      var ok = el('div', { class: 'card row', style: 'background:var(--ok-soft)' });
      ok.innerHTML = '<span style="font-size:2rem">✅</span><div><b>เกียรติบัตรนี้ออกโดยระบบจริง</b><div class="small">' + esc(r.cert.studentName) + ' · ' + esc(r.cert.title) + ' · ออกเมื่อ ' + thDate(r.cert.issuedAt, true) + '</div></div>';
      main.appendChild(ok);
      render(main, r.cert, r.settings);
    }).catch(function (e) {
      main.innerHTML = '<div class="card empty"><span class="i">❌</span><b>ตรวจสอบไม่ผ่าน</b><br>' + esc(e.message) + '</div>';
    });
  }
  return { render: render, verifyPage: verifyPage };
})();
</script>
