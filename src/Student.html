<!-- Student.html — หน้าผู้เรียน: ภารกิจ ใบความรู้ ใบงาน แบบฝึก แบบทดสอบ คะแนน เกียรติบัตร -->
<script>
var StudentApp = (function () {
  var TOK = 'cs_tok_student';
  var st = { info: null, me: null, map: null, history: [] };
  var top, view, nav, cur = null;

  function boot(info) {
    st.info = info; applyTheme(info);
    document.title = info.courseName;
    document.body.innerHTML = '';
    top = el('header', { class: 'topbar' });
    view = el('main', { class: 'wrap', id: 'view' });
    nav = el('nav', { class: 'bottomnav hidden' });
    [['home', '🎯', 'ภารกิจ'], ['gallery', '📱', 'ตัวอย่าง'], ['scores', '📊', 'คะแนน'], ['certs', '🏆', 'เกียรติบัตร'], ['logout', '🚪', 'ออก']].forEach(function (n) {
      var b = el('button', { type: 'button', 'data-k': n[0] }); b.innerHTML = '<span class="i">' + n[1] + '</span>' + n[2];
      b.onclick = function () { if (n[0] === 'logout') logout(); else go(n[0], {}, true); };
      nav.appendChild(b);
    });
    document.body.appendChild(top); document.body.appendChild(view); document.body.appendChild(nav);
    Api.onAuthLost = function () { store(TOK, null); Api.token = null; showLogin(); };
    var t = store(TOK);
    if (t) { Api.token = t; go('home', {}, true); } else showLogin();
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible' && cur && (cur.name === 'home' || cur.name === 'scores' || cur.name === 'certs') && !$('.modal-bg')) render();
    });
  }

  function setTop(title, sub, back) {
    top.innerHTML = '';
    if (back) { var b = el('button', { class: 'back', type: 'button', 'aria-label': 'ย้อนกลับ' }, '‹'); b.onclick = goBack; top.appendChild(b); }
    var br = el('div', { class: 'brand' }); br.innerHTML = esc(title) + (sub ? '<small>' + esc(sub) + '</small>' : ''); top.appendChild(br);
    if (st.me) { var w = el('div', { class: 'who' }); w.innerHTML = esc(st.me.firstName) + '<br><span class="small">' + esc(st.me.studentCode) + '</span>'; top.appendChild(w); }
  }
  function setNav(k) { nav.classList.toggle('hidden', !k); $$('button', nav).forEach(function (b) { b.classList.toggle('on', b.dataset.k === k); }); }

  function go(name, params, reset) {
    if (reset) st.history = [];
    if (cur) st.history.push(cur);
    cur = { name: name, params: params || {} };
    render();
  }
  function goBack() {
    if (!Api.token && !st.history.length) { showLogin(); return; }
    cur = st.history.pop() || { name: 'home', params: {} }; render();
  }
  function render() {
    window.scrollTo(0, 0);
    view.className = 'wrap' + (['act', 'show', 'home', 'scores', 'unit', 'certs', 'gallery'].indexOf(cur.name) >= 0 ? ' wide' : '');
    if (window.__quizTimer) { clearInterval(window.__quizTimer); window.__quizTimer = null; }
    if (window.__quizCleanup) window.__quizCleanup();
    view.innerHTML = '<div class="empty"><span class="spin" style="display:inline-block;width:28px;height:28px;border:3px solid var(--primary);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite"></span></div>';
    var f = { home: vHome, unit: vUnit, act: vActivity, scores: vScores, certs: vCerts, cert: vCert, gallery: vGallery, show: vShow }[cur.name] || vHome;
    Promise.resolve().then(function () { return f(cur.params); }).catch(function (e) {
      view.innerHTML = ''; var c = el('div', { class: 'card empty' }); c.innerHTML = '<span class="i">⚠️</span>' + esc(e.message);
      var b = el('button', { class: 'btn', style: 'margin-top:12px' }, 'ลองใหม่'); b.onclick = render; c.appendChild(el('br')); c.appendChild(b); view.appendChild(c);
    });
  }
  function loadMap() { return Api.call('courseMap').then(function (m) { st.map = m; st.me = m.student; return m; }); }

  /* ---------------- เข้าสู่ระบบ ---------------- */
  /** ข้อความหน่วยกิต 2-3-3 → "3 หน่วยกิต · ทฤษฎี 2 ชม. · ปฏิบัติ 3 ชม./สัปดาห์" */
  function creditText(s) {
    var m = String(s || '').match(/^(\d+)-(\d+)-(\d+)$/);
    return m ? m[3] + ' หน่วยกิต · ทฤษฎี ' + m[1] + ' ชม. · ปฏิบัติ ' + m[2] + ' ชม./สัปดาห์' : String(s || '');
  }
  function courseHero(info, compact) {
    var h = el('section', { class: 'land-hero' + (compact ? ' compact' : '') });
    h.innerHTML = '<div class="land-in"><div class="land-tags">' + (info.courseCode ? '<span>รหัสวิชา ' + esc(info.courseCode) + '</span>' : '') + (info.courseCredit ? '<span>' + esc(creditText(info.courseCredit)) + '</span>' : '') + '</div>' +
      '<h1>' + esc(info.courseName) + '</h1>' +
      (compact ? '' : '<p>' + esc(info.courseDescription || '') + '</p>') +
      '<div class="land-stack"><span>HTML5</span><span>CSS3</span><span>JavaScript</span><span>Vue 3</span><span>Bootstrap 5</span><span>REST API</span><span>Deploy</span></div></div>' +
      '<div class="land-phone" aria-hidden="true"><div class="lp-screen"><div class="lp-bar"></div><div class="lp-card"><i></i><i></i></div><div class="lp-grid"><b></b><b></b><b></b><b></b></div><div class="lp-code">&lt;div id="app"&gt;<br>&nbsp;{{ message }}<br>&lt;/div&gt;</div></div></div>';
    return h;
  }
  function outlineCard(info) {
    var c = el('div', { class: 'card' });
    var main = (info.outline || []).filter(function (u) { return !u.bonus; }).length;
    c.innerHTML = '<h2>🧭 สร้างเว็บแอปพลิเคชัน ต้องเรียนอะไรบ้าง</h2><p class="small muted">' + main + ' ภารกิจหลัก' + (main < (info.outline || []).length ? ' + ภารกิจพิเศษ ⭐' : '') + ' แต่ละภารกิจมี 📖 ใบความรู้ → 📝 ใบงาน → 💻 แบบฝึกปฏิบัติ → ✅ แบบทดสอบ ผ่านแล้วได้เกียรติบัตรทันที</p>';
    var ol = el('div', { class: 'outline' });
    (info.outline || []).forEach(function (u) {
      var d = el('div', { class: 'ol-item' + (u.bonus ? ' bonus' : '') });
      d.innerHTML = '<span class="ol-no">' + (u.bonus ? '⭐' : u.no) + '</span><span class="ol-ic">' + esc(u.icon) + '</span><div><b>' + esc(u.title) + '</b>' + (u.bonus ? ' <span class="chip wait">คะแนนพิเศษ</span>' : '') + '<div class="small muted">' + esc(u.summary || '') + '</div></div>';
      ol.appendChild(d);
    });
    c.appendChild(ol);
    return c;
  }
  function showLogin() {
    st.me = null; cur = null; setNav(null);
    if (window.__quizCleanup) window.__quizCleanup();
    setTop(st.info.courseName, st.info.schoolName);
    view.innerHTML = ''; view.className = 'wrap land';
    var info = st.info, S = info.stats || {};
    // ---- ส่วนหัวเต็มจอ: ข้อมูลรายวิชา + ช่องเข้าสู่ระบบ ----
    var hero = el('section', { class: 'land-full' });
    var left = el('div', { class: 'lf-text' });
    left.innerHTML = '<div class="land-tags">' + (info.courseCode ? '<span>รหัสวิชา ' + esc(info.courseCode) + '</span>' : '') + (info.courseCredit ? '<span>' + esc(creditText(info.courseCredit)) + '</span>' : '') + '<span>ภาคเรียน ' + esc(info.semester) + '/' + esc(info.academicYear) + '</span></div>' +
      '<h1>' + esc(info.courseName) + '</h1><p>' + esc(info.courseDescription || '') + '</p>' +
      '<div class="land-stack"><span>HTML5</span><span>CSS3</span><span>JavaScript</span><span>Vue 3</span><span>Bootstrap 5</span><span>REST API</span><span>Google Sheets DB</span><span>Deploy</span></div>' +
      '<div class="lf-stats">' + [[S.units, 'ภารกิจ'], [S.activities, 'กิจกรรม'], [S.tasks, 'โจทย์ฝึกเขียนโค้ด'], [S.students, 'ผู้เรียน'], [S.certificates, 'เกียรติบัตรที่ออก']].filter(function (x) { return x[0] !== undefined; })
        .map(function (x) { return '<div><b>' + fmt(x[0]) + '</b><span>' + x[1] + '</span></div>'; }).join('') + '</div>';
    hero.appendChild(left);
    var c = el('div', { class: 'card login-card glass' });
    c.innerHTML = '<div class="center"><div style="font-size:2.6rem">🧑‍💻</div><h2 style="margin:.2em 0">เข้าสู่ห้องเรียน</h2><p class="muted small">เขียนโค้ด ดูผลบนหน้าจอมือถือทันที ทำภารกิจให้ครบเพื่อรับเกียรติบัตร</p></div>';
    var f = el('form');
    f.innerHTML = '<label class="f" for="lc">รหัสนักศึกษา</label><input class="in" id="lc" inputmode="numeric" autocomplete="username" required>' +
      '<label class="f" for="lp">PIN (รับจากครูผู้สอน)</label><input class="in" id="lp" type="password" inputmode="numeric" autocomplete="current-password" required>';
    var b = el('button', { class: 'btn primary block', type: 'submit', style: 'margin-top:16px' }, 'เข้าสู่ระบบ'); b.dataset.busy = 'กำลังตรวจสอบ…';
    f.appendChild(b);
    f.onsubmit = function (e) {
      e.preventDefault();
      withBusy(b, function () {
        return Api.call('login', { studentCode: $('#lc').value, pin: $('#lp').value }).then(function (r) {
          Api.token = r.token; store(TOK, r.token); st.me = r.student; toast('ยินดีต้อนรับ ' + r.student.firstName, 'ok'); go('home', {}, true);
        });
      }).catch(function () {});
    };
    c.appendChild(f);
    var last = store('cs_last_code'); if (last) $('#lc', f).value = last;
    $('#lc', f).addEventListener('change', function () { store('cs_last_code', this.value); });
    if (Api.mode() === 'demo') c.appendChild(demoHint());
    var gb = el('button', { class: 'btn block', type: 'button', style: 'margin-top:10px' }, '📱 ดูระบบตัวอย่าง 10 ระบบ (เปิดดูได้ทันที)');
    gb.onclick = function () { go('gallery', {}, true); };
    c.appendChild(gb);
    hero.appendChild(c);
    view.appendChild(hero);
    // ---- จุดเด่นของห้องเรียน ----
    var feats = el('section', { class: 'land-feats' });
    [['📱', 'ตัวจำลองเว็บ + มือถือ', 'พิมพ์โค้ดแล้วเห็นผลทันทีบนหน้าจอมือถือจำลอง พร้อม Console ภาษาไทย'],
      ['🗄️', 'ฐานข้อมูล Google Sheets', 'ฝึก CRUD, Transaction และ LockService กับชีตหลายแท็บจำลอง'],
      ['✅', 'ตรวจงานอัตโนมัติ', 'ชุดตรวจทั้งแบบเปิดและแบบซ่อน ส่งแล้วรู้คะแนนทันที'],
      ['🛡️', 'ระบบกันทุจริต', 'บล็อกการวางข้อความจากภายนอก สุ่มข้อสอบ และแจ้งเตือนเมื่อออกจากหน้าสอบ'],
      ['🏆', 'เกียรติบัตรทุกภารกิจ', 'ผ่านเกณฑ์แล้วได้เกียรติบัตรพร้อมลายเซ็นและ QR ตรวจสอบ']].forEach(function (f) {
      var d = el('div', { class: 'feat' }); d.innerHTML = '<span class="fi">' + f[0] + '</span><b>' + f[1] + '</b><p>' + f[2] + '</p>'; feats.appendChild(d);
    });
    view.appendChild(feats);
    view.appendChild(outlineCard(st.info));
  }
  function demoHint() {
    var d = el('div', { class: 'card flat', style: 'margin:16px 0 0;background:var(--wait-soft)' });
    d.innerHTML = '<b>โหมดสาธิต</b><br>รหัส <code>692010001</code> PIN <code>1234</code> (ยังไม่เริ่มเรียน)<br>รหัส <code>692010004</code> PIN <code>1234</code> (ผ่านแล้ว 3 ภารกิจ)<br><a href="#admin">เปิดหน้าครู</a> รหัสผ่าน <code>teacher1234</code> · <a href="#" id="demo-reset">ล้างข้อมูลสาธิต</a>';
    setTimeout(function () { var r = $('#demo-reset'); if (r) r.onclick = function (e) { e.preventDefault(); if (confirm('ล้างข้อมูลสาธิตทั้งหมดและเริ่มใหม่?')) { DemoBackend.reset(); location.reload(); } }; }, 0);
    return d;
  }
  function logout() {
    confirmBox('ออกจากระบบ?', 'โค้ดที่พิมพ์ค้างไว้ยังเก็บอยู่ในเครื่องนี้', 'ออกจากระบบ').then(function (ok) {
      if (!ok) return; Api.call('logout').catch(function () {}); store(TOK, null); Api.token = null; showLogin();
    });
  }

  /* ---------------- หน้าแรก: แผนที่ภารกิจ ---------------- */
  function vHome() {
    return loadMap().then(function (m) {
      setTop(m.settings.courseName, m.settings.schoolName); setNav('home');
      view.innerHTML = '';
      var mainU = m.units.filter(function (u) { return !u.bonus; }), bonusU = m.units.filter(function (u) { return u.bonus; });
      var passed = mainU.filter(function (u) { return u.passed; }).length;
      var acts = [].concat.apply([], m.units.map(function (u) { return u.activities; }));
      var doneActs = acts.filter(function (a) { return a.done; }).length;
      var hero = el('div', { class: 'card hero hero-grad dash-hero' });
      hero.innerHTML = '<div class="ring" style="--p:' + m.overall.percent + '"><span>' + Math.round(m.overall.percent) + '%</span></div>' +
        '<div class="grow"><div class="small" style="opacity:.85">' + esc((st.info.courseCode ? st.info.courseCode + ' · ' : '') + m.settings.courseName) + '</div><h1 style="margin:0">สวัสดี ' + esc(m.student.firstName) + ' 👋</h1>' +
        '<div class="small">ผ่านแล้ว <b>' + passed + '/' + mainU.length + '</b> ภารกิจ · เกียรติบัตร <b>' + m.certificates.length + '</b> ใบ' + (m.bonus && m.bonus.max ? ' · คะแนนพิเศษ <b>' + fmt(m.bonus.earned) + '/' + fmt(m.bonus.max) + '</b>' : '') + '</div></div>';
      view.appendChild(hero);
      // ---- แดชบอร์ด ----
      var week = (m.activity || []).slice(-7).reduce(function (s, d) { return s + d.n; }, 0);
      Charts.kpis(view, [
        { icon: '🎯', label: 'คะแนนรวม', value: fmt(m.overall.earned) + '/' + fmt(m.overall.max), sub: fmt(m.overall.percent) + '% ของทุกภารกิจ' },
        { icon: '✅', label: 'กิจกรรมที่ทำแล้ว', value: doneActs + '/' + acts.length, sub: 'ใบความรู้ ใบงาน แบบฝึก แบบทดสอบ' },
        { icon: '🏆', label: 'เกียรติบัตร', value: String(m.certificates.length), sub: 'ใบ' },
        { icon: '🔥', label: 'ส่งงาน 7 วันล่าสุด', value: String(week), sub: 'ครั้ง' }
      ]);
      var dg = el('div', { class: 'dash-grid' });
      var c1 = Charts.card('ความก้าวหน้ารายภารกิจ', 'เส้นประ = เกณฑ์ผ่าน ' + m.settings.passPercent + '% · แตะแถวเพื่อเปิดภารกิจ', 'span2');
      Charts.hbars(c1, m.units.map(function (u) {
        return { label: (u.bonus ? '⭐ ' : u.no + '. ') + u.title, value: u.percent, ok: u.passed, muted: u.locked, text: u.locked ? '🔒' : fmt(u.percent) + '%',
          tip: '<b>' + esc(u.title) + '</b><br>' + fmt(u.earned) + '/' + fmt(u.max) + ' คะแนน · ทำแล้ว ' + u.doneCount + '/' + u.total + ' กิจกรรม' + (u.passed ? '<br>✓ ผ่าน ' + esc(u.level.name) : ''),
          onClick: u.locked ? null : function () { go('unit', { id: u.id }); } };
      }), { target: m.settings.passPercent, unit: '%' });
      dg.appendChild(c1);
      var c2 = Charts.card('สถานะกิจกรรม', 'ทั้งหมด ' + acts.length + ' กิจกรรม');
      var full = acts.filter(function (a) { return a.done && (!a.max || a.best >= a.max); }).length;
      Charts.donut(c2, [{ label: 'ได้คะแนนเต็ม/อ่านแล้ว', value: full, cls: 'ok' }, { label: 'ทำแล้วแต่ยังไม่เต็ม', value: doneActs - full, cls: 'wait' }, { label: 'ยังไม่ทำ', value: acts.length - doneActs, cls: 'muted' }],
        { center: Math.round(acts.length ? doneActs / acts.length * 100 : 0) + '%', sub: 'ทำแล้ว', aria: 'สถานะกิจกรรม' });
      dg.appendChild(c2);
      var c3 = Charts.card('การส่งงาน 14 วันล่าสุด', 'จำนวนครั้งที่ส่งงานต่อวัน', 'span3');
      Charts.columns(c3, (m.activity || []).map(function (d) { return { label: Charts.dayLabel(d.d), title: thDate(d.d, true), value: d.n }; }), { unit: 'ครั้ง', height: 120, xName: 'วันที่', yName: 'ส่งงาน (ครั้ง)' });
      dg.appendChild(c3);
      view.appendChild(dg);
      var sc = el('button', { class: 'card showcase-cta', type: 'button' });
      sc.innerHTML = '<span class="i">📱</span><span class="grow"><b>ระบบตัวอย่าง 10 ระบบ</b><br><span class="small muted">เปิดโค้ดจริง แก้ แล้วดูผลบนหน้าจอมือถือ</span></span><span>›</span>';
      sc.onclick = function () { go('gallery', {}, true); };
      view.appendChild(sc);
      var next = nextStep(m);
      if (next) {
        var nb = el('button', { class: 'btn primary block', style: 'margin-bottom:14px' }); nb.innerHTML = '▶ เรียนต่อ: ' + esc(next.act.title);
        nb.onclick = function () { go('act', { id: next.act.id }); }; view.appendChild(nb);
      } else if (m.overall.allPassed) {
        var done = el('div', { class: 'card center', style: 'background:var(--ok-soft)' }); done.innerHTML = '<div style="font-size:2.4rem">🎓</div><b>ยินดีด้วย! ผ่านครบทุกภารกิจแล้ว</b><br><span class="small">ดูเกียรติบัตรสำเร็จหลักสูตรได้ที่แท็บ เกียรติบัตร</span>'; view.appendChild(done);
      }
      function missionCard(u, host) {
        var c = el('div', { class: 'card mission' + (u.locked ? ' locked' : '') + (u.passed ? ' passed' : '') + (u.bonus ? ' bonus' : ''), role: 'button', tabindex: '0' });
        var chip = u.locked ? '<span class="chip">🔒 ผ่านภารกิจที่ ' + (u.no - 1) + ' ก่อน</span>' : u.passed ? '<span class="chip ok">✓ ผ่าน · ' + esc(u.level.name) + '</span>' : u.doneCount ? '<span class="chip wait">กำลังทำ ' + u.doneCount + '/' + u.total + '</span>' : '<span class="chip pri">ยังไม่เริ่ม</span>';
        c.innerHTML = '<div class="badge">' + (u.locked ? '🔒' : esc(u.icon || '🎯')) + '</div><div><div class="no">' + (u.bonus ? '⭐ ภารกิจพิเศษ (คะแนนเก็บเพิ่ม)' : 'ภารกิจที่ ' + u.no) + '</div><h3>' + esc(u.title) + (u.passed ? ' <span class="medal">' + LEVEL_MEDAL[u.level.key] + '</span>' : '') + '</h3>' +
          '<div class="small muted">' + esc(u.mission) + '</div><div class="row" style="margin-top:6px"><div class="bar grow ' + (u.passed ? 'ok' : '') + '"><i style="width:' + u.percent + '%"></i></div><span class="small">' + Math.round(u.percent) + '%</span></div><div style="margin-top:6px">' + chip + '</div></div>';
        c.onclick = function () { if (u.locked) toast('ต้องผ่านภารกิจที่ ' + (u.no - 1) + ' ก่อน (ทำครบทุกกิจกรรม และได้ ' + u.need + '% ขึ้นไป)'); else go('unit', { id: u.id }); };
        c.onkeydown = function (e) { if (e.key === 'Enter') c.onclick(); };
        host.appendChild(c);
      }
      view.appendChild(el('h2', {}, 'เส้นทางภารกิจ'));
      var mg = el('div', { class: 'mission-grid' }); mainU.forEach(function (u) { missionCard(u, mg); }); view.appendChild(mg);
      if (bonusU.length) {
        view.appendChild(el('h2', {}, '⭐ ภารกิจพิเศษ (คะแนนเก็บเพิ่ม แยกจากคะแนนหลัก)'));
        var bg = el('div', { class: 'mission-grid' }); bonusU.forEach(function (u) { missionCard(u, bg); }); view.appendChild(bg);
      }
    });
  }

  /* ---------------- ระบบตัวอย่าง 10 ระบบ ---------------- */
  function vGallery() {
    setTop('📱 ระบบตัวอย่าง 10 ระบบ', 'แตะเพื่อเปิดโค้ดและดูผลบนหน้าจอมือถือ', !st.me); setNav(st.me ? 'gallery' : null);
    view.innerHTML = '';
    var intro = el('div', { class: 'card flat', style: 'background:var(--primary-soft)' });

  /** รันชุดตรวจตามภาษาของโจทย์ */
  function runTests(t, code, list) {

  function checkVisible(sim, t, out) {

    if (!vis.length) { out.innerHTML = '<p class="small muted">ข้อนี้ไม่มีตัวอย่างให้ตรวจ ใช้ ▶ รัน แล้วเทียบกับโจทย์</p>'; return Promise.resolve(); }
    if (isWeb(t)) {
      return runTests(t, sim.getCode(), vis).then(function (rs) {
        var pass = 0, h = '<ul class="checklist done">';
        rs.forEach(function (r, k) {
          var ok = !r.error && !r.timeout && cmpOut(r.output, vis[k].expected, vis[k].compare); if (ok) pass++;
          var why = r.error ? thaiJsError(r.error) || r.error.message : 'ต้องได้ ' + vis[k].expected + ' แต่หน้าเว็บได้ ' + (r.output === '' ? '(ว่าง)' : r.output);
          h += '<li data-s="' + (ok ? '✅' : '❌') + '">' + esc(vis[k].label || ('ชุดที่ ' + (k + 1))) + (ok ? '' : '<div class="small muted">' + esc(why) + '</div>') + '</li>';
        });

      dg.appendChild(c1);
      var c2 = Charts.card('ตามประเภทกิจกรรม', 'ร้อยละของคะแนนเต็ม');
      Charts.hbars(c2, (m.byType || []).map(function (x) { return { label: TYPE_ICON[x.type] + ' ' + x.name, value: x.percent, tip: '<b>' + esc(x.name) + '</b><br>' + fmt(x.earned) + '/' + fmt(x.max) + ' คะแนน' }; }), { unit: '%' });
      if (m.bonus && m.bonus.max) c2.appendChild(el('p', { class: 'small muted' }, '⭐ คะแนนพิเศษ ' + fmt(m.bonus.earned) + '/' + fmt(m.bonus.max) + ' (' + fmt(m.bonus.percent) + '%) แยกจากคะแนนหลัก'));
      dg.appendChild(c2);
      var c3 = Charts.card('การส่งงาน 14 วันล่าสุด', 'จำนวนครั้งต่อวัน', 'span3');
      Charts.area(c3, (m.activity || []).map(function (d) { return { label: Charts.dayLabel(d.d), title: thDate(d.d, true), value: d.n }; }), { unit: 'ครั้ง', aria: 'จำนวนการส่งงานรายวัน' });
      dg.appendChild(c3);
      view.appendChild(dg);
      var ug = el('div', { class: 'grid2' }); view.appendChild(ug);
      m.units.forEach(function (u) {
        var c = el('div', { class: 'card' });
        var t = '<div class="row"><h3 class="grow" style="margin:0">' + (u.bonus ? '⭐ ภารกิจพิเศษ' : 'ภารกิจที่ ' + u.no) + ': ' + esc(u.title) + '</h3>' + (u.passed ? '<span class="chip ok">' + LEVEL_MEDAL[u.level.key] + ' ' + esc(u.level.name) + '</span>' : '<span class="chip">' + fmt(u.percent) + '%</span>') + '</div>';
        t += '<table class="tests"><tr><th>กิจกรรม</th><th>ได้</th><th>เต็ม</th><th>ครั้ง</th></tr>';
        u.activities.forEach(function (a) { t += '<tr><td>' + esc(a.typeName) + (a.override ? ' <span class="chip pri">ครูปรับ</span>' : '') + '</td><td>' + (a.max ? (a.done ? fmt(a.best) : '-') : (a.done ? '✓' : '-')) + '</td><td>' + (a.max ? fmt(a.max) : '-') + '</td><td>' + a.attempts + '</td></tr>'; });
        t += '<tr><th>รวม</th><th>' + fmt(u.earned) + '</th><th>' + fmt(u.max) + '</th><th>' + fmt(u.percent) + '%</th></tr></table>';
        c.innerHTML = t; ug.appendChild(c);
      });
      if (m.history.length) {
        var hc = el('div', { class: 'card' }); var t = '<h3>ประวัติการส่งล่าสุด</h3><table class="tests"><tr><th>วันที่</th><th>กิจกรรม</th><th>คะแนน</th></tr>';
        m.history.forEach(function (x) { t += '<tr><td class="small">' + thDateTime(x.at) + '</td><td>' + esc(x.title) + '</td><td>' + fmt(x.score) + '/' + fmt(x.max) + '</td></tr>'; });
        hc.innerHTML = t + '</table>'; view.appendChild(hc);
      }
    });
  }

  /* ---------------- เกียรติบัตร ---------------- */
  function vCerts() {
    return loadMap().then(function (m) {
      setTop('เกียรติบัตรของฉัน', m.student.name); setNav('certs');
      view.innerHTML = '';
      if (!m.certificates.length) {
        var e = el('div', { class: 'card empty' }); e.innerHTML = '<span class="i">🏆</span><b>ยังไม่มีเกียรติบัตร</b><br>ทำทุกกิจกรรมในภารกิจให้ครบ และได้คะแนนตั้งแต่ ' + m.settings.passPercent + '% เพื่อรับเกียรติบัตรใบแรก';
        var b = el('button', { class: 'btn primary', style: 'margin-top:12px' }, 'ไปทำภารกิจ'); b.onclick = function () { go('home', {}, true); }; e.appendChild(el('br')); e.appendChild(b);
        view.appendChild(e); return;
      }
      var lv = { 'ดีเยี่ยม': 0, 'ดีมาก': 0, 'ผ่าน': 0 };
      m.certificates.forEach(function (c) { if (c.unitId !== 'COURSE' && lv[c.level] !== undefined) lv[c.level]++; });
      var mainCount = m.units.filter(function (u) { return !u.bonus; }).length;
      var dg = el('div', { class: 'dash-grid' });
      var c1 = Charts.card('ระดับเกียรติบัตรรายภารกิจ', 'ทั้งหมด ' + (lv['ดีเยี่ยม'] + lv['ดีมาก'] + lv['ผ่าน']) + ' ใบ');
      Charts.donut(c1, [{ label: '🥇 ดีเยี่ยม (≥ 90%)', value: lv['ดีเยี่ยม'], cls: 'gold' }, { label: '🥈 ดีมาก (≥ 75%)', value: lv['ดีมาก'], cls: 'silver' }, { label: '🥉 ผ่าน', value: lv['ผ่าน'], cls: 'bronze' }],
        { center: lv['ดีเยี่ยม'] + lv['ดีมาก'] + lv['ผ่าน'], sub: 'ใบ', aria: 'ระดับเกียรติบัตร' });
      dg.appendChild(c1);
      var c2 = Charts.card('เส้นทางสู่เกียรติบัตรสำเร็จหลักสูตร', 'ต้องผ่านภารกิจหลักครบ ' + mainCount + ' ภารกิจ', 'span2');
      var got = m.units.filter(function (u) { return !u.bonus && u.passed; }).length;
      Charts.hbars(c2, [{ label: 'ภารกิจหลักที่ผ่านแล้ว', value: mainCount ? got / mainCount * 100 : 0, text: got + '/' + mainCount, ok: got === mainCount }], { unit: '%' });
      var row = el('div', { class: 'cert-strip' });
      m.units.forEach(function (u) { var s = el('span', { class: u.passed ? 'on' : '', title: u.title }, u.passed ? LEVEL_MEDAL[u.level.key] : (u.bonus ? '⭐' : String(u.no))); row.appendChild(s); });
      c2.appendChild(row);
      dg.appendChild(c2);
      view.appendChild(dg);
      var list = el('div', { class: 'cert-list' });
      m.certificates.slice().sort(function (a, b) { return a.unitId === 'COURSE' ? -1 : b.unitId === 'COURSE' ? 1 : (a.unitId < b.unitId ? -1 : 1); }).forEach(function (c) {
        var d = el('div', { class: 'card cert-card', role: 'button', tabindex: '0' });
        d.innerHTML = '<div class="medal">' + (c.unitId === 'COURSE' ? '🎓' : LEVEL_MEDAL[c.level]) + '</div><div class="grow"><b>' + esc(c.title) + '</b><div class="small muted">ระดับ' + esc(c.level) + ' (' + fmt(c.percent) + '%) · ' + thDate(c.issuedAt) + '</div><div class="small muted">เลขที่ ' + esc(c.certNo) + '</div></div><span>›</span>';
        d.onclick = function () { go('cert', { certNo: c.certNo }); };
        list.appendChild(d);
      });
      view.appendChild(list);
    });
  }
  function vCert(p) {
    return Api.call('getCertificate', { certNo: p.certNo }).then(function (r) {
      setTop('เกียรติบัตร', r.cert.certNo, true); setNav('certs');
      view.innerHTML = '';
      CertView.render(view, r.cert, r.settings);
    });
  }

  /** แสดงความยินดีเมื่อได้เกียรติบัตรใหม่ */
  function celebrate(list, then) {
    if (!list || !list.length) { if (then) then(); return; }
    confetti();
    modal(function (m, close) {
      var c = list[0];
      var d = el('div', { class: 'celebrate' });
      d.innerHTML = '<span class="big">' + (c.unitId === 'COURSE' ? '🎓' : LEVEL_MEDAL[c.level]) + '</span><h2>ยินดีด้วย! ได้รับเกียรติบัตรใหม่</h2><p><b>' + esc(c.title) + '</b><br>ระดับ' + esc(c.level) + ' (' + fmt(c.percent) + '%)</p>' +
        (list.length > 1 ? '<p class="small muted">และอีก ' + (list.length - 1) + ' ใบ</p>' : '');
      m.appendChild(d);
      var row = el('div', { class: 'row' });
      var later = el('button', { class: 'btn grow' }, 'ไว้ทีหลัง'), view1 = el('button', { class: 'btn primary grow' }, 'ดูเกียรติบัตร');
      later.onclick = function () { close(); };
      view1.onclick = function () { then = null; close(); go('cert', { certNo: c.certNo }); };
      row.appendChild(later); row.appendChild(view1); m.appendChild(row);
    }, { onClose: function () { if (then) then(); } });
  }

  function debounce(fn, ms) { var t; return function () { var a = arguments, s = this; clearTimeout(t); t = setTimeout(function () { fn.apply(s, a); }, ms); }; }

  return { boot: boot };
})();
</script>
