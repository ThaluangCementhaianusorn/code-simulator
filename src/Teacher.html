<!-- Teacher.html — หลังบ้านครู: ภาพรวม สมุดคะแนน นักศึกษา เกียรติบัตร เนื้อหา -->
<script>
var TeacherApp = (function () {
  var TOK = 'cs_tok_teacher';
  var info, top, layout, side, nav, view, tab = 'dash', gb = null;
  var TABS = [['dash', '📊', 'ภาพรวม'], ['grades', '📒', 'สมุดคะแนน'], ['students', '👥', 'นักศึกษา'], ['certs', '🏆', 'เกียรติบัตร'], ['content', '📚', 'เนื้อหา'], ['settings', '⚙️', 'ตั้งค่า']];
  var refreshTimer = null;

  function boot(i) {
    info = i; applyTheme(i); document.title = 'หลังบ้านครู · ' + i.courseName;
    document.body.innerHTML = '';
    top = el('header', { class: 'topbar' });
    top.innerHTML = '<div class="brand">หลังบ้านครู<small>' + esc(i.courseName) + '</small></div>';
    document.body.appendChild(top);
    layout = el('div', { class: 't-layout' });
    side = el('aside', { class: 'sidebar' }); nav = el('nav', { class: 'bottomnav' }); view = el('main', { class: 'wrap wide' });
    TABS.forEach(function (t) {
      var a = el('button', { type: 'button', 'data-k': t[0] }); a.innerHTML = '<span>' + t[1] + '</span> ' + t[2]; a.onclick = function () { show(t[0]); }; side.appendChild(a);
      var b = el('button', { type: 'button', 'data-k': t[0] }); b.innerHTML = '<span class="i">' + t[1] + '</span>' + t[2]; b.onclick = function () { show(t[0]); }; nav.appendChild(b);
    });
    layout.appendChild(side); layout.appendChild(view); layout.appendChild(nav);
    Api.onAuthLost = function () { store(TOK, null); Api.token = null; login(); };
    var t = store(TOK);
    if (t) { Api.token = t; show('dash'); return; }
    Api.call('teacherAuto').then(function (r) { if (r.token) { Api.token = r.token; store(TOK, r.token); show('dash'); } else login(); }).catch(login);
  }

  function login() {
    if (layout.parentNode) layout.remove();
    var w = el('main', { class: 'wrap' }); document.body.appendChild(w);
    var c = el('div', { class: 'card', style: 'max-width:420px;margin:24px auto' });
    c.innerHTML = '<div class="center"><div style="font-size:3rem">👩‍🏫</div><h1>เข้าสู่ระบบครู</h1><p class="muted small">ตั้งรหัสผ่านได้จาก Google Sheet → เมนู ⚙️ ตั้งค่าระบบ → ตั้งรหัสผ่านครู</p></div>';
    var f = el('form'); f.innerHTML = '<label class="f" for="tp">รหัสผ่านครู</label><input class="in" id="tp" type="password" autocomplete="current-password" required>';
    var b = el('button', { class: 'btn primary block', type: 'submit', style: 'margin-top:14px' }, 'เข้าสู่ระบบ');
    f.appendChild(b); c.appendChild(f);
    if (Api.mode() === 'demo') c.appendChild(el('p', { class: 'small muted center' }, 'โหมดสาธิต: รหัสผ่าน teacher1234'));
    var sl = el('p', { class: 'center small' }); sl.innerHTML = '<a href="' + esc(Api.mode() === 'sheet' ? (info.webAppUrl || '?') : '#student') + '">← ไปหน้านักศึกษา</a>'; c.appendChild(sl);
    w.appendChild(c);
    f.onsubmit = function (e) {
      e.preventDefault();
      withBusy(b, function () { return Api.call('teacherLogin', { password: $('#tp').value }).then(function (r) { Api.token = r.token; store(TOK, r.token); w.remove(); show('dash'); }); }).catch(function () {});
    };
  }

  function show(k) {
    tab = k;
    if (!layout.parentNode) document.body.appendChild(layout);
    $$('button', side).concat($$('button', nav)).forEach(function (b) { b.classList.toggle('on', b.dataset.k === k); });
    var lo = el('button', { class: 'back', style: 'margin-left:auto;width:auto;padding:0 12px;font-size:.85rem', type: 'button' }, 'ออกจากระบบ');
    lo.onclick = function () { Api.call('logout').catch(function () {}); store(TOK, null); Api.token = null; location.reload(); };
    var old = $('.back', top); if (old) old.remove();
    var oldc = $('.conn', top); if (oldc) oldc.remove();
    var mode = Api.mode(), conn = el('span', { class: 'conn chip ' + (mode === 'demo' ? 'wait' : 'ok'), style: 'margin-left:auto', title: mode === 'demo' ? 'ข้อมูลเก็บในเบราว์เซอร์นี้เท่านั้น' : 'อ่าน/เขียน Google Sheet ทุกครั้ง' },
      mode === 'demo' ? 'โหมดสาธิต' : (mode === 'github' ? '🟢 GitHub ↔ Google Sheet' : '🟢 Google Sheet'));
    top.appendChild(conn); lo.style.marginLeft = '8px'; top.appendChild(lo);
    if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
    if (k === 'dash') refreshTimer = setInterval(function () {
      if (tab !== 'dash' || $('.modal-bg') || document.visibilityState !== 'visible') return;
      vDash().catch(function () {});
    }, 30000);
    view.innerHTML = '<div class="empty">กำลังโหลด…</div>';
    window.scrollTo(0, 0);
    ({ dash: vDash, grades: vGrades, students: vStudents, certs: vCerts, content: vContent, settings: vSettings }[k])().catch(function (e) {
      view.innerHTML = '<div class="card empty"><span class="i">⚠️</span>' + esc(e.message) + '</div>';
    });
  }

  /* ---------------- ภาพรวม ---------------- */
  function vDash() {
    return Api.call('tDashboard').then(function (d) {
      view.innerHTML = '<h1>ภาพรวม</h1><p class="muted small" style="margin-top:-6px">' + esc(d.settings.schoolName) + ' · ภาคเรียน ' + esc(d.settings.semester) + '/' + esc(d.settings.academicYear) + ' · อัปเดต ' + new Date().toLocaleTimeString('th-TH') + ' (รีเฟรชเองทุก 30 วินาที)</p>';
      var week = (d.activity || []).slice(-7).reduce(function (s, x) { return s + x.n; }, 0);
      Charts.kpis(view, [
        { icon: '👥', label: 'นักศึกษา', value: String(d.kpi.students), sub: 'คน (ใช้งานอยู่)' },
        { icon: '📈', label: 'ความก้าวหน้าเฉลี่ย', value: fmt(d.kpi.avgPercent) + '%', sub: 'ภารกิจหลักทั้งหมด' },
        { icon: '🏆', label: 'เกียรติบัตรที่ออก', value: String(d.kpi.certificates), sub: 'ใบ · จบหลักสูตร ' + d.kpi.finished + ' คน' },
        { icon: '📤', label: 'ส่งงาน 7 วันล่าสุด', value: String(week), sub: 'ครั้ง' },
        { icon: '🚨', label: 'แจ้งเตือนทุจริต', value: String(d.integrity ? d.integrity.total : 0), sub: (d.integrity ? d.integrity.students : 0) + ' คน', tone: d.integrity && d.integrity.total ? 'bad' : '' }
      ]).classList.add('k5');
      var dg = el('div', { class: 'dash-grid' });
      var c1 = Charts.card('การส่งงาน 14 วันล่าสุด', 'ทุกห้อง · จำนวนครั้งต่อวัน', 'span2');
      Charts.area(c1, (d.activity || []).map(function (x) { return { label: Charts.dayLabel(x.d), title: thDate(x.d, true), value: x.n }; }), { unit: 'ครั้ง', aria: 'จำนวนการส่งงานรายวัน' });
      dg.appendChild(c1);
      var c2 = Charts.card('สถานะผู้เรียน', d.kpi.students + ' คน');
      Charts.donut(c2, [{ label: 'จบหลักสูตร', value: d.status ? d.status.finished : 0, cls: 'ok' }, { label: 'กำลังเรียน', value: d.status ? d.status.learning : 0, cls: 'pri' }, { label: 'ยังไม่เริ่ม', value: d.status ? d.status.notStarted : 0, cls: 'muted' }],
        { center: d.kpi.students, sub: 'คน', aria: 'สถานะผู้เรียน' });
      dg.appendChild(c2);
      var c3 = Charts.card('ผู้ผ่านรายภารกิจ', 'ร้อยละของนักศึกษาที่ผ่าน · ชี้เพื่อดูค่าเฉลี่ย', 'span2');
      Charts.hbars(c3, d.units.map(function (x) {
        var p = d.kpi.students ? x.passed / d.kpi.students * 100 : 0;
        return { label: x.no + '. ' + x.title + (x.bonus ? ' ⭐' : ''), value: p, text: x.passed + '/' + d.kpi.students, ok: p >= 80,
          tip: '<b>' + esc(x.title) + '</b><br>เริ่มแล้ว ' + x.started + ' คน · ผ่าน ' + x.passed + ' คน<br>คะแนนเฉลี่ย ' + fmt(x.avg) + '%' };
      }), { unit: '%' });
      dg.appendChild(c3);
      var c4 = Charts.card('การกระจายคะแนนรวม', 'จำนวนนักศึกษาในแต่ละช่วงร้อยละ');
      Charts.columns(c4, (d.distribution || []).map(function (x) { return { label: String(x.lo), title: x.lo + '–' + (x.hi === 100 ? 100 : x.hi - 1) + '%', value: x.n }; }), { unit: 'คน', height: 140, labelEvery: 2, xName: 'ช่วงคะแนน', yName: 'จำนวน (คน)' });
      dg.appendChild(c4);
      view.appendChild(dg);
      if (d.integrity && d.integrity.recent.length) {
        var ic = el('div', { class: 'card integrity-log' });
        var ih = '<h3>🚨 แจ้งเตือนทุจริตล่าสุด <span class="chip bad">' + d.integrity.total + ' ครั้ง</span></h3><p class="small muted">วางข้อความจากภายนอกในใบงาน · คัดลอกข้อสอบ · ออกจากหน้าสอบ (ดูรายคนได้ที่สมุดคะแนน → แตะชื่อ)</p><div class="tbl-wrap"><table class="tbl"><tr><th>เวลา</th><th>นักศึกษา</th><th>กิจกรรม</th><th>พฤติกรรม</th></tr>';
        d.integrity.recent.forEach(function (x) { ih += '<tr><td class="small">' + thDateTime(x.at) + '</td><td>' + esc(x.name) + '</td><td>' + esc(x.title) + '</td><td>' + (x.quiz ? '✅ ' : '📝 ') + esc(x.kind) + '</td></tr>'; });
        ic.innerHTML = ih + '</table></div>'; view.appendChild(ic);
      }
      var g = el('div', { class: 'grid2' });
      var u = el('div', { class: 'card' }); var t = '<h3>ผลรายภารกิจ</h3><div class="tbl-wrap"><table class="tbl"><tr><th>ภารกิจ</th><th class="num">เริ่มแล้ว</th><th class="num">ผ่าน</th><th>เฉลี่ย</th></tr>';
      d.units.forEach(function (x) { t += '<tr><td>' + esc(x.icon) + ' ' + x.no + '. ' + esc(x.title) + (x.bonus ? ' ⭐' : '') + '</td><td class="num">' + x.started + '</td><td class="num"><b>' + x.passed + '</b>/' + d.kpi.students + '</td><td style="min-width:110px"><div class="row"><div class="bar grow"><i style="width:' + x.avg + '%"></i></div><span class="small">' + fmt(x.avg) + '%</span></div></td></tr>'; });
      u.innerHTML = t + '</table></div>';
      g.appendChild(u);
      var todo = el('div', { class: 'card' });
      var h = '<h3>ต้องติดตาม <span class="chip ' + (d.inactive.length ? 'wait' : 'ok') + '">' + d.inactive.length + ' คน</span></h3><p class="small muted">ไม่ได้เข้าทำกิจกรรมเกิน 7 วัน หรือยังไม่เคยเริ่ม</p>';
      if (!d.inactive.length) h += '<div class="empty small">ทุกคนยังเรียนต่อเนื่อง 👍</div>';
      else { h += '<table class="tbl"><tr><th>ชื่อ</th><th>ห้อง</th><th>ล่าสุด</th></tr>'; d.inactive.slice(0, 15).forEach(function (s) { h += '<tr><td>' + esc(s.name) + '</td><td>' + esc(s.room) + '</td><td class="small">' + (s.last ? thDate(s.last) : '<span class="chip">ยังไม่เริ่ม</span>') + '</td></tr>'; }); h += '</table>'; }
      todo.innerHTML = h; g.appendChild(todo);
      view.appendChild(g);
      var r = el('div', { class: 'card' }); var rh = '<h3>การส่งงานล่าสุด</h3>';
      if (!d.recent.length) rh += '<div class="empty small">ยังไม่มีการส่งงาน</div>';
      else { rh += '<div class="tbl-wrap"><table class="tbl"><tr><th>เวลา</th><th>นักศึกษา</th><th>กิจกรรม</th><th class="num">คะแนน</th></tr>'; d.recent.forEach(function (x) { rh += '<tr><td class="small">' + thDateTime(x.at) + '</td><td>' + esc(x.name) + '</td><td>' + esc(x.title) + '</td><td class="num">' + fmt(x.score) + '/' + fmt(x.max) + '</td></tr>'; }); rh += '</table></div>'; }
      r.innerHTML = rh; view.appendChild(r);
    });
  }

  /* ---------------- สมุดคะแนน ---------------- */
  function vGrades() {
    return Api.call('tGradebook').then(function (d) {
      gb = d;
      view.innerHTML = '<h1>สมุดคะแนน</h1>';
      var rooms = Array.from(new Set(d.rows.map(function (r) { return r.student.room || '-'; }))).sort();
      var live = d.rows.filter(function (r) { return r.status !== 'deleted'; });
      var dg = el('div', { class: 'dash-grid' });
      var c1 = Charts.card('คะแนนเฉลี่ยรายห้อง', 'ร้อยละรวมของภารกิจหลัก');
      Charts.hbars(c1, rooms.map(function (rm) {
        var list = live.filter(function (r) { return (r.student.room || '-') === rm; });
        var avg = list.length ? list.reduce(function (s2, r) { return s2 + r.percent; }, 0) / list.length : 0;
        return { label: rm, value: avg, tip: '<b>' + esc(rm) + '</b><br>' + list.length + ' คน · เฉลี่ย ' + fmt(avg) + '%' };
      }), { unit: '%', target: info.passPercent });
      dg.appendChild(c1);
      var c2 = Charts.card('คะแนนเฉลี่ยรายภารกิจ', 'ร้อยละ · ทุกห้อง', 'span2');
      Charts.columns(c2, d.units.map(function (u) {
        var avg = live.length ? live.reduce(function (s2, r) { return s2 + (r.units[u.id] ? r.units[u.id].percent : 0); }, 0) / live.length : 0;
        return { label: String(u.no), title: 'ภารกิจที่ ' + u.no + ' ' + u.title + (u.bonus ? ' ⭐ คะแนนพิเศษ' : ''), value: Math.round(avg * 10) / 10 };
      }), { unit: '%', max: 100, height: 130, labelEvery: 1, xName: 'ภารกิจ', yName: 'เฉลี่ย (%)' });
      dg.appendChild(c2);
      view.appendChild(dg);
      var state = { room: 'all', q: '', detail: false };
      var ctl = el('div', { class: 'card flat' });
      var q = el('input', { class: 'in', placeholder: '🔍 ค้นหาชื่อหรือรหัสนักศึกษา' });
      var chips = el('div', { class: 'chips' });
      ['all'].concat(rooms).forEach(function (r) { var b = el('button', { class: 'chip' + (r === 'all' ? ' on' : ''), type: 'button' }, r === 'all' ? 'ทุกห้อง' : r); b.onclick = function () { state.room = r; $$('button', chips).forEach(function (x) { x.classList.remove('on'); }); b.classList.add('on'); draw(); }; chips.appendChild(b); });
      var row = el('div', { class: 'row' });
      var det = el('label', { class: 'row small' }); det.innerHTML = '<input type="checkbox"> แสดงคะแนนรายกิจกรรม'; $('input', det).onchange = function () { state.detail = this.checked; draw(); };
      var csv = el('button', { class: 'btn sm right' }, '⬇ ส่งออก CSV'); csv.onclick = function () { exportCsv(d, filtered()); };
      row.appendChild(det); row.appendChild(csv);
      ctl.appendChild(q); ctl.appendChild(chips); ctl.appendChild(row);
      view.appendChild(ctl);
      q.oninput = function () { state.q = q.value.trim().toLowerCase(); draw(); };
      var out = el('div', { class: 'card' }); view.appendChild(out);
      function filtered() {
        return d.rows.filter(function (r) { return r.status !== 'deleted' && (state.room === 'all' || (r.student.room || '-') === state.room) && (!state.q || (r.student.name + ' ' + r.student.studentCode).toLowerCase().indexOf(state.q) >= 0); })
          .sort(function (a, b) { return String(a.student.studentCode) < String(b.student.studentCode) ? -1 : 1; });
      }
      function draw() {
        var rows = filtered();
        if (!rows.length) { out.innerHTML = '<div class="empty"><span class="i">👥</span>ไม่พบนักศึกษา<br><span class="small">เพิ่มรายชื่อได้ที่แท็บ นักศึกษา</span></div>'; return; }
        var h = '<div class="small muted" style="margin-bottom:6px">' + rows.length + ' คน · แตะชื่อเพื่อดูรายละเอียด ดูโค้ดที่ส่ง และปรับคะแนน</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>รหัส</th><th>ชื่อ</th><th>ห้อง</th>';
        d.units.forEach(function (u) {
          if (state.detail) d.activities.filter(function (a) { return a.unitId === u.id && a.max > 0; }).forEach(function (a) { h += '<th class="num" title="' + esc(a.title) + '">' + u.no + '.' + TYPE_ICON[a.type] + '<br><span class="small muted">/' + fmt(a.max) + '</span></th>'; });
          h += '<th class="num" title="' + esc(u.title) + '">' + ('ภารกิจ ' + u.no + (u.bonus ? ' ⭐' : '')) + '</th>';
        });
        h += '<th class="num">รวม</th><th>สถานะ</th><th class="num" title="จำนวนครั้งที่ระบบแจ้งเตือนทุจริต">🚨</th></tr></thead><tbody>';
        rows.forEach(function (r) {
          h += '<tr class="click" data-id="' + esc(r.student.id) + '"><td>' + esc(r.student.studentCode) + '</td><td>' + esc(r.student.name) + (r.isSample ? ' <span class="chip">ตัวอย่าง</span>' : '') + '</td><td>' + esc(r.student.room) + '</td>';
          d.units.forEach(function (u) {
            if (state.detail) d.activities.filter(function (a) { return a.unitId === u.id && a.max > 0; }).forEach(function (a) { var x = r.acts[a.id]; h += '<td class="num">' + (x.done ? fmt(x.best) + (x.override ? '*' : '') : '<span class="muted">-</span>') + '</td>'; });
            var uu = r.units[u.id]; h += '<td class="num">' + (uu.passed ? LEVEL_MEDAL[uu.level] + ' ' : '') + fmt(uu.percent) + '%</td>';
          });
          h += '<td class="num"><b>' + fmt(r.percent) + '%</b></td><td>' + (r.allPassed ? '<span class="chip ok">🎓 จบหลักสูตร</span>' : r.status === 'inactive' ? '<span class="chip bad">ปิดบัญชี</span>' : '<span class="chip">' + d.units.filter(function (u) { return !u.bonus && r.units[u.id] && r.units[u.id].passed; }).length + '/' + d.units.filter(function (u) { return !u.bonus; }).length + ' ภารกิจ</span>') + '</td><td class="num">' + ((d.integrity || {})[r.student.id] ? '<span class="chip bad">' + d.integrity[r.student.id] + '</span>' : '<span class="muted">-</span>') + '</td></tr>';
        });
        out.innerHTML = h + '</tbody></table></div>' + (state.detail ? '<p class="small muted">* = ครูปรับคะแนน</p>' : '');
        $$('tr.click', out).forEach(function (tr) { tr.onclick = function () { studentDetail(tr.dataset.id, function () { show('grades'); }); }; });
      }
      draw();
    });
  }

  function exportCsv(d, rows) {
    var head = ['รหัสนักศึกษา', 'ชื่อ-สกุล', 'ห้อง'];
    d.units.forEach(function (u) { d.activities.filter(function (a) { return a.unitId === u.id && a.max > 0; }).forEach(function (a) { head.push(a.title + ' (' + a.max + ')'); }); var nm = 'ภารกิจ ' + u.no + (u.bonus ? ' (คะแนนพิเศษ)' : ''); head.push(nm + ' (%)'); head.push(nm + ' ระดับ'); });
    head.push('คะแนนรวม'); head.push('คะแนนเต็ม'); head.push('ร้อยละรวม'); head.push('คะแนนพิเศษ'); head.push('แจ้งเตือนทุจริต (ครั้ง)');
    var out = [head];
    rows.forEach(function (r) {
      var line = [r.student.studentCode, r.student.name, r.student.room];
      d.units.forEach(function (u) { d.activities.filter(function (a) { return a.unitId === u.id && a.max > 0; }).forEach(function (a) { var x = r.acts[a.id]; line.push(x.done ? x.best : ''); }); line.push(r.units[u.id].percent); line.push(r.units[u.id].level || ''); });
      line.push(r.earned); line.push(r.max); line.push(r.percent); line.push(r.bonus ? r.bonus.earned : ''); line.push((d.integrity || {})[r.student.id] || 0);
      out.push(line);
    });
    downloadText('สมุดคะแนน-' + new Date().toISOString().slice(0, 10) + '.csv', toCsv(out), 'text/csv');
  }

  function studentDetail(id, after) {
    Api.call('tStudentDetail', { studentId: id }).then(function (d) {
      modal(function (m, close) {
        m.appendChild(el('h2', {}, d.student.name));
        m.appendChild(el('p', { class: 'muted small' }, 'รหัส ' + d.student.studentCode + ' · ' + (d.student.room || '-') + ' · ' + (d.status === 'inactive' ? 'ปิดบัญชี' : 'ใช้งาน')));
        var row = el('div', { class: 'row' });
        var pin = el('button', { class: 'btn sm' }, '🔑 ออก PIN ใหม่');

    var d; try { d = JSON.parse(json); } catch (e) { return Promise.reject(new Error('JSON ไม่ถูกต้อง')); }
    if (!d.tasks) { out.innerHTML = '<p class="muted">ใช้ได้กับใบงานและแบบฝึกเท่านั้น</p>'; return Promise.resolve(); }
    var html = [];
    return d.tasks.reduce(function (p, t, i) {
      return p.then(function () {
        if (!t.solution) { html.push('<p>ข้อ ' + (i + 1) + ': <span class="chip wait">ไม่มี solution</span></p>'); return; }
        var web = t.lang !== 'python';
        var run = web ? WebRunner.tests(t.solution, t.tests || [], { lang: t.lang === 'js' || t.lang === 'gas' ? t.lang : 'html', sheets: t.sheets }) : PyRunner.tests(t.solution, (t.tests || []).map(function (x) { return x.input || ''; }));
        return run.then(function (rs) {
          var bad = [];
          rs.forEach(function (r, k) { if (r.error || r.timeout || !cmpOut(r.output, t.tests[k].expected, t.tests[k].compare)) bad.push('ชุด ' + (k + 1) + (t.tests[k].label ? ' (' + esc(t.tests[k].label) + ')' : '') + ': ได้ <code>' + esc(r.error ? (web ? r.error.message : thaiError(r.error).raw) : r.output) + '</code> แต่ expected คือ <code>' + esc(t.tests[k].expected) + '</code>'); });
          html.push('<p>ข้อ ' + (i + 1) + ' ' + esc(t.title || '') + ': ' + (bad.length ? '<span class="chip bad">ไม่ผ่าน ' + bad.length + '/' + rs.length + '</span><br>' + bad.join('<br>') : '<span class="chip ok">✓ เฉลยผ่านครบ ' + rs.length + ' ชุด</span>') + '</p>');
        });
      });
    }, Promise.resolve()).then(function () { out.innerHTML = html.join(''); });
  }

  /* ---------------- ลายเซ็นบนเกียรติบัตร ---------------- */
  /** แปลงภาพลายเซ็นเป็น PNG พื้นโปร่งใส ย่อขนาดและครอปขอบว่าง ให้เก็บใน 1 ช่องของ Google Sheet ได้ */
  function processSignature(img) {
    var maxW = 520, maxH = 180;
    var k = Math.min(1, maxW / img.width, maxH / img.height);
    var w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
    var cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    var g = cv.getContext('2d'); g.drawImage(img, 0, 0, w, h);
    var d = g.getImageData(0, 0, w, h), px = d.data, minX = w, minY = h, maxX = -1, maxY = -1;
    for (var y = 0; y < h; y++) for (var x = 0; x < w; x++) {
      var i = (y * w + x) * 4, lum = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
      // พื้นสีขาว/สว่าง → โปร่งใส · เส้นหมึก → ปรับให้เข้มขึ้น
      var a = px[i + 3] * Math.max(0, Math.min(1, (235 - lum) / 90));
      px[i + 3] = a;
      if (a > 24) { if (x < minX) minX = x; if (x > maxX) maxX = x; if (y < minY) minY = y; if (y > maxY) maxY = y; }
    }
    if (maxX < 0) throw new Error('ไม่พบลายเซ็นในภาพ (ภาพสว่างเกินไป) ลองถ่ายบนกระดาษขาวด้วยปากกาสีเข้ม');
    g.putImageData(d, 0, 0);
    var pad = 6; minX = Math.max(0, minX - pad); minY = Math.max(0, minY - pad); maxX = Math.min(w - 1, maxX + pad); maxY = Math.min(h - 1, maxY + pad);
    var out = document.createElement('canvas'); out.width = maxX - minX + 1; out.height = maxY - minY + 1;
    out.getContext('2d').drawImage(cv, minX, minY, out.width, out.height, 0, 0, out.width, out.height);
    var url = out.toDataURL('image/png');
    if (url.length > 45000) { // ใหญ่เกิน: ย่อลงอีก
      var s2 = document.createElement('canvas'), f = Math.sqrt(42000 / url.length);
      s2.width = Math.round(out.width * f); s2.height = Math.round(out.height * f);
      s2.getContext('2d').drawImage(out, 0, 0, s2.width, s2.height); url = s2.toDataURL('image/png');
    }
    return url;
  }
  /** แผ่นวาดลายเซ็นด้วยนิ้ว/เมาส์ */
  function drawPad(onDone) {
    modal(function (m, close) {
      m.appendChild(el('h2', {}, '✍️ เซ็นชื่อบนหน้าจอ'));
      m.appendChild(el('p', { class: 'small muted' }, 'ใช้นิ้วหรือเมาส์เซ็นในกรอบ ระบบจะครอปขอบและทำพื้นหลังโปร่งใสให้'));
      var cv = el('canvas', { class: 'sig-pad', width: 600, height: 220 }); m.appendChild(cv);
      var g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, 600, 220); g.lineWidth = 3.2; g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = '#0B1F4D';
      var down = false, any = false;
      function pos(e) { var r = cv.getBoundingClientRect(), t = e.touches ? e.touches[0] : e; return [(t.clientX - r.left) * 600 / r.width, (t.clientY - r.top) * 220 / r.height]; }
      function start(e) { e.preventDefault(); down = true; var p = pos(e); g.beginPath(); g.moveTo(p[0], p[1]); }
      function move(e) { if (!down) return; e.preventDefault(); var p = pos(e); g.lineTo(p[0], p[1]); g.stroke(); any = true; }
      function end() { down = false; }
      cv.addEventListener('mousedown', start); cv.addEventListener('mousemove', move); window.addEventListener('mouseup', end);
      cv.addEventListener('touchstart', start, { passive: false }); cv.addEventListener('touchmove', move, { passive: false }); cv.addEventListener('touchend', end);
      var row = el('div', { class: 'row', style: 'margin-top:10px' });
      var clr = el('button', { class: 'btn grow', type: 'button' }, 'ล้าง'), ok = el('button', { class: 'btn primary grow', type: 'button' }, 'ใช้ลายเซ็นนี้');
      clr.onclick = function () { g.fillStyle = '#fff'; g.fillRect(0, 0, 600, 220); any = false; };
      ok.onclick = function () {
        if (!any) { toast('ยังไม่ได้เซ็น', 'bad'); return; }
        var im = new Image(); im.onload = function () { try { var u = processSignature(im); close(); onDone(u); } catch (e) { toast(e.message, 'bad'); } }; im.src = cv.toDataURL('image/png');
      };
      row.appendChild(clr); row.appendChild(ok); m.appendChild(row);
    }, { sticky: true });
  }
  function signatureCard(by) {
    var c = el('div', { class: 'card' });
    c.innerHTML = '<h3>✍️ ลายเซ็นบนเกียรติบัตร</h3><p class="small muted" style="margin-top:-4px">อัปโหลดภาพลายเซ็น (ถ่ายบนกระดาษขาวด้วยปากกาสีเข้ม หรือไฟล์ PNG พื้นโปร่งใส) หรือเซ็นบนหน้าจอ ระบบทำพื้นหลังโปร่งใสและย่อขนาดให้อัตโนมัติ แล้วนำไปพิมพ์บนเกียรติบัตรทุกใบทันที</p>';
    var g = el('div', { class: 'sig-grid' });
    [['signer1', 'ครูผู้สอน'], ['signer2', 'ผู้อำนวยการ']].forEach(function (x) {
      var key = x[0] + 'Sig', name = (by[x[0] + 'Name'] || {}).value || '', pos = (by[x[0] + 'Position'] || {}).value || x[1];
      var cur = (by[key] || {}).value || '';
      var box = el('div', { class: 'sig-box' });
      box.innerHTML = '<div class="small muted">ผู้ลงนามคนที่ ' + x[0].slice(-1) + ' · ' + esc(pos) + '</div>';
      var prev = el('div', { class: 'sig-prev' });
      function show(u) { prev.innerHTML = u ? '<img alt="ลายเซ็น" src="' + esc(u) + '">' : '<span class="muted small">ยังไม่มีลายเซ็น</span>'; prev.insertAdjacentHTML('beforeend', '<div class="ln"></div><div class="small">(' + esc(name || '.................................') + ')<br>' + esc(pos) + '</div>'); }
      show(cur); box.appendChild(prev);
      var file = el('input', { type: 'file', accept: 'image/png,image/jpeg,image/webp', class: 'hidden' });
      var row = el('div', { class: 'row' });
      var up = el('button', { class: 'btn sm', type: 'button' }, '⬆ อัปโหลดภาพ'), dr = el('button', { class: 'btn sm', type: 'button' }, '✍️ เซ็นบนจอ'), rm = el('button', { class: 'btn sm danger', type: 'button' }, 'ลบ');
      function save(u) {
        return Api.call('tSaveSettings', { settings: (function () { var o = {}; o[key] = u; return o; })() }).then(function () { cur = u; show(u); toast(u ? 'บันทึกลายเซ็น' + x[1] + 'แล้ว' : 'ลบลายเซ็นแล้ว', 'ok'); }).catch(function (e) { toast(e.message, 'bad'); });
      }
      up.onclick = function () { file.click(); };
      file.onchange = function () {
        var f = file.files[0]; if (!f) return;
        if (f.size > 8 * 1024 * 1024) { toast('ไฟล์ใหญ่เกิน 8 MB', 'bad'); return; }
        var fr = new FileReader();
        fr.onload = function () { var im = new Image(); im.onload = function () { try { save(processSignature(im)); } catch (e) { toast(e.message, 'bad'); } }; im.onerror = function () { toast('เปิดไฟล์ภาพไม่ได้', 'bad'); }; im.src = fr.result; };
        fr.readAsDataURL(f); file.value = '';
      };
      dr.onclick = function () { drawPad(save); };
      rm.onclick = function () { if (!cur) return; confirmBox('ลบลายเซ็น' + x[1] + '?', 'เกียรติบัตรจะแสดงเส้นสำหรับเซ็นแทน', 'ลบ').then(function (ok) { if (ok) save(''); }); };
      row.appendChild(up); row.appendChild(dr); row.appendChild(rm);
      box.appendChild(row); box.appendChild(file); g.appendChild(box);
    });
    c.appendChild(g);
    return c;
  }

  return { boot: boot };
})();
